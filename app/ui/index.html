<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline HUD · 外观稿 v2</title>
<style>
  :root {
    /* 面板底色拆成 rgb + alpha，透明度滑杆只改 --panel-alpha，不动配色 */
    --panel-rgb: 16, 17, 22;
    --panel-alpha: 0.82;
    --shade-alpha: calc(var(--panel-alpha) * 0.9);   /* 遮罩随透明度滑杆一起变 */
    --font-scale: 1;          /* 条目字号缩放，和时间轴密度无关 */
    --panel-line: rgba(255, 255, 255, 0.09);
    --text: #ECECF1;
    --dim: #8E8F9C;
    --faint: #5C5E6C;
    --accent: #7C8CFF;
    --due: #FF6B8A;
    --sched: #7C8CFF;
    --todo: #6B7280;
    --doing: #F5A524;
    --done: #30C48D;
    --empty: #3F4550;
    --gutter: calc(56px + (var(--font-scale) - 1) * 14px);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI Variable Text", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #08090D;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- 假桌面 ---------------- */
  .desk { position: fixed; inset: 0; overflow: hidden; }

  .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
  .b1 { width: 640px; height: 640px; left: -180px; top: -200px;
        background: radial-gradient(circle, #2C3C82 0%, transparent 68%); opacity: .62; }
  .b2 { width: 520px; height: 520px; right: 120px; top: -60px;
        background: radial-gradient(circle, #5A2350 0%, transparent 68%); opacity: .5; }
  .b3 { width: 720px; height: 520px; left: 34%; bottom: -300px;
        background: radial-gradient(circle, #0F4952 0%, transparent 68%); opacity: .55; }
  .b4 { width: 460px; height: 460px; right: 180px; bottom: 40px;
        background: radial-gradient(circle, #6B4A1E 0%, transparent 70%); opacity: .38; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 60% 45%, #000 26%, transparent 76%);
  }

  .fake-win {
    position: absolute;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.042);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 34px 90px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .fake-win .bar {
    height: 30px; background: rgba(255,255,255,.035);
    border-bottom: 1px solid rgba(255,255,255,.05);
    display: flex; align-items: center; gap: 5px; padding-left: 12px;
  }
  .fake-win .bar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .lines { position: absolute; left: 22px; top: 50px; right: 22px; display: grid; gap: 11px; }
  .lines i { display: block; height: 7px; border-radius: 3px; background: rgba(255,255,255,.055); }
  .lines i:nth-child(2n) { width: 62%; }
  .lines i:nth-child(3n) { width: 84%; }
  .lines i:nth-child(4n) { width: 46%; background: rgba(124,140,255,.16); }

  .w1 { width: 560px; height: 430px; left: 52px; top: 128px; }
  .w2 { width: 470px; height: 320px; right: 42px; bottom: 56px; opacity: .85; }
  /* 正对着面板的一块亮窗，用来体现玻璃透光 */
  .w3 {
    width: 520px; height: 560px; right: 108px; top: 176px;
    background: rgba(255,255,255,.055);
  }
  .w3 .lines { top: 58px; }
  .w3 .lines i { height: 9px; background: rgba(255,255,255,.09); }
  .w3 .lines i:nth-child(4n) { background: rgba(255,107,138,.22); }

  .mock-tag {
    position: fixed; left: 26px; top: 24px;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(255,255,255,.3);
    display: flex; align-items: center; gap: 8px;
  }
  .mock-tag span.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ---------------- 面板 ---------------- */
  .panel {
    position: fixed;
    right: max(80px, calc(50vw - 640px));
    top: 50%;
    transform: translateY(-50%);
    width: 460px;
    height: 720px;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    isolation: isolate;          /* 让 -1 层的遮罩待在内容下面 */
    background: rgba(var(--panel-rgb), var(--panel-alpha));
    border: 1px solid var(--panel-line);
    backdrop-filter: blur(26px) saturate(165%) brightness(1.06);
    -webkit-backdrop-filter: blur(26px) saturate(165%) brightness(1.06);
    box-shadow:
      0 50px 120px -30px rgba(0,0,0,.9),
      0 0 0 1px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
    animation: rise .34s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(-50% + 14px)) scale(.985); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
  }

  /* ---------------- 顶栏 ---------------- */
  /* 纵向渐变遮罩：独立一层，透明度低时不会把面板压死 */
  .panel-shade {
    position: absolute; inset: 0; z-index: -1;
    pointer-events: none; border-radius: inherit;
    background: linear-gradient(
      180deg,
      rgba(0, 0, 0, var(--shade-alpha)),
      rgba(0, 0, 0, calc(var(--shade-alpha) * 0.45)) 50%,
      rgba(0, 0, 0, calc(var(--shade-alpha) * 0.73))
    );
  }

  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 17px 14px 11px 18px;
    flex: none;
  }
  .date-line { display: flex; align-items: baseline; gap: 8px; }
  .date-line .d { font-size: 17.5px; font-weight: 600; letter-spacing: .3px; }
  .date-line .w {
    font-size: 10.5px; color: var(--dim);
    background: rgba(255,255,255,.06);
    padding: 2px 7px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .sub { margin-top: 5px; font-size: 11.5px; color: var(--dim); letter-spacing: .2px; }
  .sub b { color: #CFD0D9; font-weight: 500; }
  .sub .warn { color: #FF9AAE; }
  .sub .warn.clickable {
    cursor: pointer; padding: 1px 6px; border-radius: 5px;
    background: rgba(255,107,138,.14); border: 1px solid rgba(255,107,138,.26);
    transition: background .14s;
  }
  .sub .warn.clickable:hover { background: rgba(255,107,138,.26); }
  .chip.flash { animation: chipflash 1.3s ease; }
  @keyframes chipflash {
    0%, 55% { border-color: rgba(255,107,138,.85); box-shadow: 0 0 0 2px rgba(255,107,138,.5); }
    100% { border-color: rgba(255,255,255,.065); box-shadow: none; }
  }

  .actions { display: flex; gap: 2px; align-items: center; }
  .fontbtn { width: 24px; font-size: 11px; font-weight: 600; letter-spacing: 0; }
  .fontval {
    font-size: 9px; font-weight: 400; color: var(--faint);
    min-width: 30px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .iconbtn {
    width: 28px; height: 28px; border: 0; border-radius: 8px;
    background: transparent; color: var(--dim);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .iconbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .iconbtn svg { width: 15px; height: 15px; stroke: currentColor; fill: none;
                 stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------------- 快速新增 ---------------- */
  .quickadd {
    flex: none;
    margin: 0 14px 8px;
    height: 40px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 11px;
    border-radius: 11px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.075);
    transition: border-color .18s, background .18s;
  }
  .quickadd:focus-within { border-color: rgba(124,140,255,.5); background: rgba(124,140,255,.08); }
  .quickadd .plus { color: var(--faint); font-size: 15px; line-height: 1; }
  .quickadd input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 12.5px; font-family: inherit; letter-spacing: .2px;
  }
  .quickadd input::placeholder { color: var(--faint); }
  .quickadd kbd {
    font-family: inherit; font-size: 10px; color: var(--faint);
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.045);
    padding: 2px 5px; border-radius: 5px;
  }

  /* ---------------- 空白新建 ---------------- */
  .cband {
    position: absolute; left: 7px; right: 6px; z-index: 11;
    background: rgba(124,140,255,.22);
    border: 1px solid rgba(124,140,255,.55);
    border-radius: 7px; pointer-events: none;
  }
  .phcard {
    position: absolute; left: 7px; right: 6px; z-index: 12;
    min-height: 34px; padding: 4px 8px 5px;
    display: flex; flex-direction: column; gap: 2px;
    border: 1px dashed rgba(124,140,255,.8); border-radius: 8px;
    background: rgba(124,140,255,.1);
  }
  .phcard .phtime { font-size: 9px; color: #AEB6FF; font-variant-numeric: tabular-nums; }
  .phcard .phin {
    width: 100%; border: 0; outline: 0; background: transparent;
    color: var(--text); font-family: inherit; font-size: 12px;
  }
  .phcard .phin::placeholder { color: var(--faint); }
  .phcard .phhint { font-size: 9px; color: var(--faint); }

  /* ---------------- 搜索 ---------------- */
  .search {
    display: none; flex: none; align-items: center; gap: 8px;
    margin: 0 14px 8px; height: 32px; padding: 0 11px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(124,140,255,.32);
  }
  .search.open { display: flex; }
  .search input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 12px; font-family: inherit;
  }
  .search input::placeholder { color: var(--faint); }
  .search .cnt { font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .search kbd {
    font-family: inherit; font-size: 10px; color: var(--faint);
    border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.045);
    padding: 2px 5px; border-radius: 5px;
  }
  .chip.hide, .ditem.hide { display: none; }

  /* ---------------- 时间线 ---------------- */
  .timeline { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  .gutterbg {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--gutter); z-index: 3;
    background: linear-gradient(90deg, rgba(11,12,16,.55), rgba(11,12,16,.28));
    border-right: 1px solid rgba(255,255,255,.045);
    pointer-events: none;
  }

  .trackbar {
    position: absolute; top: 0; left: var(--gutter); right: 0; height: 34px; z-index: 6;
    display: flex; align-items: center; gap: 5px; padding: 0 10px;
    backdrop-filter: blur(14px);
    background: linear-gradient(rgba(14,15,20,.95), rgba(14,15,20,.6) 74%, transparent);
    border-bottom: 1px solid rgba(255,255,255,.05);
    pointer-events: none;
  }
  .trackbar::after {
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 20px;
    background: linear-gradient(rgba(14,15,20,.88), rgba(14,15,20,.3) 55%, transparent);
  }
  .track {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 5px;
    height: 23px; padding: 0 9px; border-radius: 7px;
    border: 1px solid transparent; background: transparent;
    color: var(--faint); font-family: inherit; font-size: 11px; letter-spacing: .08em;
    cursor: pointer; transition: color .16s, background .16s, border-color .16s;
  }
  .track i { width: 5px; height: 5px; border-radius: 50%; opacity: .55; }
  .track[data-track="sched"] i { background: var(--sched); }
  .track[data-track="due"] i   { background: var(--due); }
  .track b {
    font-weight: 500; font-size: 9px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .track:hover { color: var(--dim); background: rgba(255,255,255,.045); }
  .track.on {
    color: #E9E9EF; background: rgba(255,255,255,.075);
    border-color: rgba(255,255,255,.09);
  }
  .track.on i { opacity: 1; }
  .track.on[data-track="sched"] i { box-shadow: 0 0 7px rgba(124,140,255,.85); }
  .track.on[data-track="due"] i   { box-shadow: 0 0 7px rgba(255,107,138,.85); }
  .track-hint {
    margin-left: auto; font-size: 9.5px; color: var(--faint); letter-spacing: .04em;
  }

  .scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .scroll::-webkit-scrollbar { display: none; }

  .canvas { position: relative; }

  .dayline {
    position: absolute; left: var(--gutter); right: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.022) 62%, transparent);
  }
  .daylabel {
    position: absolute; left: 4px; width: auto;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    transform: translateY(-50%);
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    z-index: 4;
  }
  .daylabel .row { display: flex; align-items: baseline; gap: 2px; }
  .daylabel .num {
    font-size: calc(13px * (1 + (var(--font-scale) - 1) * 0.6));
    font-weight: 600; letter-spacing: .2px;
  }
  .daylabel .wd {
    font-size: calc(9px * (1 + (var(--font-scale) - 1) * 0.6));
    letter-spacing: .04em;
  }
  .daylabel.today { transform: translateY(2px); }
  .daylabel.today .num { color: var(--accent); }
  .daylabel.today .wd  { color: rgba(124,140,255,.75); }
  .today-pill {
    font-size: 8px; letter-spacing: .1em;
    color: #BCC4FF; background: rgba(124,140,255,.17);
    border: 1px solid rgba(124,140,255,.28);
    padding: 1px 5px; border-radius: 4px;
    line-height: 1.3;
  }

  .lane {
    position: absolute; top: 0; bottom: 0;
    left: var(--gutter); right: 8px;
    z-index: 1;                    /* 高于 .hour-layer(0)，卡片才能压住刻度线 */
    transition: opacity .18s ease;
  }
  .lane[data-track="sched"] {
    background: linear-gradient(180deg, rgba(124,140,255,.03), rgba(124,140,255,.008));
  }
  .lane[data-track="due"] {
    background: linear-gradient(180deg, rgba(255,107,138,.026), rgba(255,107,138,.006));
  }
  .timeline[data-track="sched"] .lane[data-track="due"],
  .timeline[data-track="due"] .lane[data-track="sched"] {
    opacity: 0; pointer-events: none;
  }

  /* ---------------- 任务卡 ---------------- */
  .chip {
    position: absolute;
    width: fit-content;
    min-width: 156px;
    max-width: calc(100% - 14px);
    padding: 4px 7px 5px 8px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(30,32,40,.99), rgba(24,26,33,.99));
    border: 1px solid rgba(255,255,255,.065);
    border-left: 2px solid var(--lane-color, var(--accent));
    cursor: default;
    user-select: none;
    min-height: calc(30px * var(--font-scale, 1));
    transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s;
  }
  .chip:hover {
    transform: translateY(-1px);
    background: linear-gradient(180deg, rgba(40,43,54,.97), rgba(32,34,43,.98));
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.8);
    z-index: 20 !important;
  }
  .chip.sel {
    background: linear-gradient(180deg, rgba(52,58,92,.96), rgba(40,44,66,.97));
    border-color: rgba(124,140,255,.45);
    box-shadow: 0 0 0 1px rgba(124,140,255,.28), 0 10px 22px -10px rgba(0,0,0,.85);
    z-index: 21 !important;
  }
  .chip.overdue { opacity: .62; }
  .chip.done .t { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.28); color: #9B9CA6; }

  .chip .row1 { display: flex; align-items: flex-start; gap: 5px; }
  .dot {
    flex: none; width: 6px; height: 6px; border-radius: 50%;
    margin-top: 4px;
    background: var(--empty);
  }
  .dot.todo  { background: var(--todo); }
  .dot.doing { background: var(--doing); box-shadow: 0 0 6px rgba(245,165,36,.55); }
  .dot.done  { background: var(--done); }

  .chip .t {
    font-size: calc(12px * var(--font-scale, 1)); line-height: 1.32; letter-spacing: .1px;
    color: #E6E6EC;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .chip .row2 {
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px; padding-left: 11px;
    font-size: calc(9px * var(--font-scale, 1)); color: var(--faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
  }
  .chip .row2 .tag {
    color: #7A7C8D;
    background: rgba(255,255,255,.055);
    padding: 0 4px; border-radius: 3px;
    max-width: 62px; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .late { color: #FF8FA3; letter-spacing: .01em; }
  .chip.sized { overflow: hidden; }
  .chip .hedge {
    position: absolute; left: 0; right: 0; height: 6px; z-index: 3; cursor: ns-resize;
  }
  .chip .hedge.top { top: -1px; right: 22px; }     /* 右上角留给 ↗ */
  .chip .hedge.bottom { bottom: -1px; }
  .chip .hedge:hover { background: rgba(124,140,255,.5); }
  .chip .hedge::after {
    content: ""; position: absolute; left: 6px; right: 6px; height: 1px;
    background: transparent; transition: background .12s;
  }
  .chip .hedge.top::after { top: 0; }
  .chip .hedge.bottom::after { bottom: 0; }
  .chip .hedge:hover::after { background: rgba(190,200,255,.95); }
  .chip.allday .hedge { display: none; }
  .chip.allday:hover .hedge { display: block; }   /* 全天卡 hover 后也能拖上下沿转定时 */
  .chip.edge-drag { box-shadow: 0 0 0 1px rgba(124,140,255,.7); }
  /* 外链按钮：绝对定位，不参与文字排版（hover 才出现） */
  .chip .link {
    position: absolute; right: 3px; top: 3px;
    width: 16px; height: 16px; padding: 0; line-height: 15px;
    border: 0; border-radius: 5px; text-align: center;
    background: rgba(18,19,24,.82); color: #C9CAD6;
    font-family: inherit; font-size: 10px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .12s, background .12s, color .12s;
  }
  .chip:hover .link { opacity: 1; pointer-events: auto; }
  .chip .link:hover { background: rgba(124,140,255,.5); color: #fff; }
  .tick { position: absolute; left: 0; width: 6px; height: 2px; border-radius: 2px; opacity: .7; }

  /* ---------------- 小时刻度 ---------------- */
  .hour-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .hourline {
    position: absolute; left: var(--gutter); right: 6px; height: 1px;
    background: rgba(255,255,255,.12);      /* 仍比日线淡，但能看清 */
  }
  .hourline.half { background: rgba(255,255,255,.06); }   /* 120+ 档的半小时线，再淡一档 */
  .hourlabel {
    position: absolute; right: calc(100% - var(--gutter) + 2px);
    font-size: calc(11px * var(--font-scale, 1)); color: #A8AAB8;
    line-height: 1.15; white-space: nowrap;
    padding: 1px 4px; border-radius: 4px;
    background: rgba(0,0,0,.35);            /* 整点标签垫一层，压住穿过的线条 */
    transform: translateY(-50%);
    font-variant-numeric: tabular-nums;
  }
  .hourlabel.midnight { padding-left: 2px; padding-right: 2px; }

  /* ---------------- 拖拽改期 ---------------- */
  body.drag-lock,
  body.drag-lock * { user-select: none; }        /* 只禁选中，滚轮/边缘滚动照常 */
  .chip.dragging {
    cursor: grabbing;
    transition: none;
    z-index: 30 !important;
    background: rgba(124,140,255,.16);
    border-color: rgba(124,140,255,.4);
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.9);
  }
  .dragtip {
    position: fixed; z-index: 70; pointer-events: none;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(20,21,26,.95);
    border: 1px solid rgba(255,255,255,.14);
    color: #E9E9F0; font-size: 10px; letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .1s;
  }
  .dragtip.on { opacity: 1; }

  /* ---------------- 空状态 ---------------- */
  .empty-hint {
    position: absolute; left: var(--gutter); right: 8px; top: 50%;
    transform: translateY(calc(-50% - 16px));
    text-align: center; font-size: 11px; letter-spacing: .04em;
    color: var(--faint); pointer-events: none; z-index: 0;   /* 低于 now 线，不挡它 */
    opacity: 0; transition: opacity .18s;
  }
  .empty-hint.on { opacity: .9; }

  /* ---------------- now 线 ---------------- */
  .nowline {

    const allDay = !!t[ALL_DAY_KEY[key]];
    const end = t[END_KEY[key]];
    let h = baseH;
    if (!allDay && typeof end === "number" && end > t[key]) {
      h = Math.max(baseH, (end - t[key]) * 60 * PX_PER_MIN);
      el.style.height = h + "px";
      el.classList.add("sized");
    }
    item.h = h;
    return h;
  }

  /* 上下沿拖动：上沿改 start（end 固定），下沿改 end（start 固定） */
  function startEdgeDrag(e, el, t, key, side) {
    const item = items[key].find(it => it.el === el);
    if (!item) return;

    const allDay = !!t[ALL_DAY_KEY[key]];
    const hadEnd = typeof t[END_KEY[key]] === "number" && t[END_KEY[key]] > t[key];
    const startMin0 = Math.round(t[key] * 60);
    const endMin0 = hadEnd ? Math.round(t[END_KEY[key]] * 60) : startMin0 + 30;
    const baseH = el._baseH || el.offsetHeight;
    const baseMin = base / 60000;
    /* 全天卡没有 end：按卡片高度折算时长，15 分钟吸附、最短 30 分钟 */
    const allDayDur = allDay
      ? Math.max(30, Math.ceil((baseH / PX_PER_MIN) / DRAG_SNAP_MIN) * DRAG_SNAP_MIN)
      : 0;

    let pointerY = e.clientY;
    let pointerX = e.clientX;
    const top0 = parseFloat(el.style.top) || item.y;
    const height0 = el.offsetHeight;
    let dragging = false;
    let curStart = startMin0;
    let curEnd = allDay ? startMin0 + allDayDur : (hadEnd ? endMin0 : null);
    let stopAuto = null;
    let rafId = 0;
    let pendingY = pointerY;

    document.body.classList.add("drag-lock");
    dragActive = true;
    resizing = true;
    if (e.pointerId !== undefined && el.setPointerCapture) {
      try { el.setPointerCapture(e.pointerId); } catch (_err) { /* 捕获失败不影响拖拽 */ }
    }

    const pointOf = min => {
      const d = new Date(base + min * 60000);
      return {
        date: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
        time: pad(d.getHours()) + ":" + pad(d.getMinutes())
      };
    };

    const restore = () => {
      el.style.top = top0 + "px";
      el.style.height = height0 + "px";
      layoutLane(key);
    };

    /* 预览只改 top/height，不重排、不做命中检测 */
    const applyPreview = y => {
      const relMin = minuteAt(y) - baseMin;
      if (allDay) {
        if (side === "start") {
          curStart = relMin;
          curEnd = curStart + allDayDur;
        } else {
          curEnd = Math.max(relMin, startMin0 + EDGE_MIN_MINUTES);
          curStart = startMin0;
        }
      } else if (side === "start") {
        curStart = hadEnd ? Math.min(relMin, endMin0 - EDGE_MIN_MINUTES) : relMin;
      } else {
        curEnd = Math.max(relMin, startMin0 + EDGE_MIN_MINUTES);
      }
      const topMin = side === "start" ? curStart : startMin0;
      const bottomMin = curEnd === null ? endMin0 : curEnd;
      el.style.top = yOf(base + topMin * 60000) + "px";
      if (curEnd !== null) {
        el.style.height = Math.max(baseH, (bottomMin - topMin) * PX_PER_MIN) + "px";
      }
      dragtip.textContent = allDay
        ? hhmm(base + curStart * 60000) + "–" + hhmm(base + curEnd * 60000)
        : hhmm(base + (side === "start" ? curStart : curEnd) * 60000);
      placeDragTip(pointerX, y);
      dragtip.classList.add("on");
    };

    /* 一帧只算一次，连续 pointermove 不会来回抖 */
    const schedule = y => {
      pendingY = y;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = 0;
        applyPreview(pendingY);
      });
    };

    const onMove = ev => {
      if (e.pointerId !== undefined && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      pointerY = ev.clientY;
      pointerX = ev.clientX;
      if (!dragging) {
        if (Math.abs(ev.clientY - e.clientY) < 3) return;
        dragging = true;
        el.classList.add("edge-drag");
        stopAuto = startAutoScroll(() => pointerY, () => schedule(pointerY));
      }
      schedule(pointerY);
    };

    const detach = () => {
      dragActive = false;
      holdResizing();
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (stopAuto) { stopAuto(); stopAuto = null; }
      if (e.pointerId !== undefined && el.releasePointerCapture) {
        try { el.releasePointerCapture(e.pointerId); } catch (_err) { /* 已释放 */ }
      }
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onCancel);
      window.removeEventListener("keydown", onKey, true);
      document.body.classList.remove("drag-lock");
      dragtip.classList.remove("on");
      el.classList.remove("edge-drag");
    };

    const onKey = ev => {
      if (ev.key !== "Escape") return;
      ev.preventDefault();
      ev.stopPropagation();
      detach();
      restore();
    };

    const onCancel = () => {
      detach();
      restore();
    };

    const onUp = async () => {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (dragging) applyPreview(pointerY);     // 松手前对齐最后一次指针位置
      detach();
      if (!dragging) return;
      suppressClickOnce();
      el._dragEndedAt = Date.now();

      const submitStart = allDay
        ? curStart
        : (hadEnd ? Math.min(curStart, endMin0 - EDGE_MIN_MINUTES) : curStart);
      const submitEnd = curEnd === null
        ? null
        : (allDay ? curEnd : Math.max(curEnd, submitStart + EDGE_MIN_MINUTES));
      if (submitStart === startMin0 && (submitEnd === null ? endMin0 : submitEnd) === endMin0) {
        restore();
        return;
      }
      const api = bridge();
      if (!api) { restore(); return; }
      el.style.opacity = ".7";
      const res = await api.resize_task(
        t.id, TRACK_PROP[key], pointOf(submitStart),
        submitEnd === null ? null : pointOf(submitEnd));
      el.style.opacity = "";
      if (res && res.ok) {
        t[key] = submitStart / 60;
        t[END_KEY[key]] = submitEnd === null ? null : submitEnd / 60;
        if (allDay) {
          t[ALL_DAY_KEY[key]] = false;
          el.classList.remove("allday");
        }
        item.y = yOf(base + t[key] * H);
        const timeSpan = el.querySelector(".row2 span");
        if (timeSpan) timeSpan.textContent = chipTimeText(t, key);
        applyChipSpanHeight(item);
      } else {
        restore();
        toast("调整失败：" + ((res && res.error) || "未知错误"));
      }
      layoutLane(key);
    };

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onCancel);
    window.addEventListener("keydown", onKey, true);
  }

  function chipHtml(t, key, ts, late) {
    const lateText = late
      ? (nowTs - ts >= DAY ? "逾期 " + Math.ceil((nowTs - ts) / DAY) + "d"
                           : "逾期 " + Math.max(1, Math.round((nowTs - ts) / H)) + "h")
      : "";
    return (
      '<div class="row1">' +
        '<span class="dot ' + t.status + '"></span>' +
        '<span class="t">' + t.title + '</span>' +
      '</div>' +
      '<button class="link" title="在 Notion 打开" aria-label="在 Notion 打开">↗</button>' +
      '<div class="row2">' +
        '<span>' + chipTimeText(t, key) + '</span>' +
        (t.tag ? '<span class="tag">' + t.tag + '</span>' : '') +
        (lateText ? '<span class="late">' + lateText + '</span>' : '') +
      '</div>' +
      '<div class="hedge top" data-edge="start"></div>' +
      '<div class="hedge bottom" data-edge="end"></div>'
    );
  }

  /* ---------- 拖拽改期（同轨上下拖，15 分钟吸附） ---------- */
  const dragtip = document.getElementById("dragtip");
  const TRACK_PROP = { sched: "安排日期", due: "截止日期" };
  const ALL_DAY_KEY = { sched: "allDaySched", due: "allDayDue" };
  const END_KEY = { sched: "endSched", due: "endDue" };
  const DRAG_SNAP_MIN = 15;   // 吸附粒度
  const DRAG_CLICK_PX = 4;    // 位移小于这个像素数算点击，不写
  let dragActive = false;     // 拖拽中忽略缩放，否则像素位移和分钟数会换算错
  let resizing = false;       // 拖拽结束再多保持一帧，挡住 mouseup 后的误 click

  function holdResizing() {
    requestAnimationFrame(() => requestAnimationFrame(() => { resizing = false; }));
  }

  /* 指针位置 → 该处的时刻（统一走 yToMinute，zoom / 滚动都在里面） */
  function tsAtPoint(clientY) {
    return yToMinute(clientY) * 60000;
  }

  /* 目标时刻 → 吸附后的毫秒数：全天按整天，其余按 15 分钟 */
  function snapMs(ms, allDay) {
    const step = allDay ? DAY : DRAG_SNAP_MIN * 60000;
    return Math.round(ms / step) * step;
  }

  /* 时间气泡：目标时刻（跨天时把日期一起给出） */
  function tipLabel(t, key, ts) {
    const d = new Date(ts);
    const day = (d.getMonth() + 1) + "-" + d.getDate();
    return t[ALL_DAY_KEY[key]] ? day + " 全天" : day + " " + hhmm(ts);
  }

  /* 指针 y → 每帧滚动量（px）：越贴边越快，2~8 线性 */
  function edgeSpeed(pointerY) {
    const rect = scroll.getBoundingClientRect();
    if (pointerY < rect.top + DRAG_EDGE_PX) {
      const k = Math.min(1, (rect.top + DRAG_EDGE_PX - pointerY) / DRAG_EDGE_PX);
      return -(DRAG_SPEED_MIN + (DRAG_SPEED_MAX - DRAG_SPEED_MIN) * k);
    }
    if (pointerY > rect.bottom - DRAG_EDGE_PX) {
      const k = Math.min(1, (pointerY - (rect.bottom - DRAG_EDGE_PX)) / DRAG_EDGE_PX);
      return DRAG_SPEED_MIN + (DRAG_SPEED_MAX - DRAG_SPEED_MIN) * k;
    }
    return 0;
  }

  /* 共享的贴边自动滚动；返回 stop()。onStep 在真的滚动了之后调用 */
  function startAutoScroll(pointerY, onStep) {
    let raf = 0;
    const step = () => {
      raf = 0;
      const y = pointerY();
      const speed = y === null || y === undefined ? 0 : edgeSpeed(y);
      if (speed) {
        const before = scroll.scrollTop;
        scroll.scrollTop = before + speed;
        if (scroll.scrollTop !== before) onStep();
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
  }

  /* 气泡跟随指针，靠右放不下就翻到左边 */
  function placeDragTip(x, y) {
    const w = dragtip.offsetWidth || 72;
    let left = x + 12;
    if (left + w > window.innerWidth - 8) left = x - w - 12;
    dragtip.style.left = Math.max(4, left) + "px";
    dragtip.style.top = Math.max(4, y - 28) + "px";
  }

  const DRAG_EDGE_PX = 48;      // 进入上下这么多像素开始自动滚
  const DRAG_SPEED_MIN = 2;     // 贴边前的速度 px/帧
  const DRAG_SPEED_MAX = 8;     // 贴边时的速度 px/帧（原来 14，冲得太快）

  function startDrag(e, el, t, key) {
    const item = items[key].find(it => it.el === el);
    if (!item) return;
    const allDay = !!t[ALL_DAY_KEY[key]];
    const startTs = base + t[key] * H;
    const grabTs = tsAtPoint(e.clientY);   // 按下瞬间指针下的时刻
    const origTop = parseFloat(el.style.top) || item.y;
    const topOffset = origTop - yOf(startTs);   // 被避让顶开的那点偏移，拖动时保留
    const startClientY = e.clientY;
    const allDayDur = allDay
      ? Math.max(30, Math.ceil(((el._baseH || el.offsetHeight) / PX_PER_MIN) / DRAG_SNAP_MIN)
        * DRAG_SNAP_MIN)
      : 0;
    let pointerY = e.clientY;
    let dragging = false;
    let targetTs = startTs;
    let stopAuto = null;
    let rafId = 0;
    let pendingY = pointerY;

    e.preventDefault();    // 禁掉原生文本选择 / 拖影
    e.stopPropagation();   // 别冒泡出去，避免触发窗口拖动 / 空白创建
    dragActive = true;
    resizing = true;
    document.body.classList.add("drag-lock");
    if (e.pointerId !== undefined && el.setPointerCapture) {
      try { el.setPointerCapture(e.pointerId); } catch (_err) { /* 捕获失败不影响拖拽 */ }
    }

    const restore = () => {
      el.style.top = origTop + "px";
      layoutLane(key);
    };

    /* 每帧都按「指针位置」重算，zoom / 滚动都在 yToMinute 里处理 */
    const updatePreview = () => {
      if (allDay) {
        /* 全天卡拖出时间：start 跟着指针，时长按卡片高度折算 */
        targetTs = snapMinute(yToMinute(pointerY)) * 60000;
        el.style.top = yOf(targetTs) + "px";
        dragtip.textContent =
          hhmm(targetTs) + "–" + hhmm(targetTs + allDayDur * 60000);
      } else {
        targetTs = startTs + (tsAtPoint(pointerY) - grabTs);
        el.style.top = (yOf(targetTs) + topOffset) + "px";
        dragtip.textContent = tipLabel(t, key, startTs + snapMs(targetTs - startTs, false));
      }
      dragtip.classList.add("on");
    };

    const schedule = y => {
      pendingY = y;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = 0;
        updatePreview();
      });
    };

    const placeTip = ev => placeDragTip(ev.clientX, ev.clientY);

    const onScroll = () => { if (dragging) schedule(pointerY); };

    /* 拖拽中按 Esc：取消并归位，不发请求 */
    const onKey = ev => {
      if (ev.key !== "Escape") return;
      ev.preventDefault();
      ev.stopPropagation();
      detach();
      restore();
    };

    const detach = () => {
      dragActive = false;
      holdResizing();
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (stopAuto) { stopAuto(); stopAuto = null; }
      if (e.pointerId !== undefined && el.releasePointerCapture) {
        try { el.releasePointerCapture(e.pointerId); } catch (_err) { /* 已释放 */ }
      }
      window.removeEventListener("keydown", onKey, true);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onCancel);
      window.removeEventListener("blur", onCancel);
      scroll.removeEventListener("scroll", onScroll);
      document.body.classList.remove("drag-lock");
      dragtip.classList.remove("on");
      el.classList.remove("dragging");
    };

    /* 拖到窗口外/切走焦点，收不到 pointerup：取消并归位，别卡在拖拽态 */
    const onCancel = () => {
      detach();
      restore();
    };

    const onMove = ev => {
      if (e.pointerId !== undefined && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      pointerY = ev.clientY;
      if (!dragging) {
        if (Math.abs(ev.clientY - startClientY) < DRAG_CLICK_PX) return;
        dragging = true;
        el.classList.add("dragging");
        stopAuto = startAutoScroll(() => pointerY, () => schedule(pointerY));
      }
      schedule(pointerY);
      placeTip(ev);
    };

    const onUp = async () => {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (dragging) updatePreview();
      detach();
      if (!dragging) return;          // 位移不足 4px：当作点击，交给 click 处理
      suppressClickOnce();
      el._dragEndedAt = Date.now();

      const api = bridge();
      if (!api) {
        restore();
        return;
      }
      el.style.opacity = ".7";

      if (allDay) {
        /* 全天 → 定时：start = 松手点（15 分钟吸附），end = start + 高度折算时长 */
        const startMin = snapMinute(yToMinute(pointerY));
        const endMin = startMin + allDayDur;
        const res = await api.resize_task(
          t.id, TRACK_PROP[key], pointOfMinute(startMin), pointOfMinute(endMin));
        el.style.opacity = "";
        if (res && res.ok) {
          t[key] = (startMin - base / 60000) / 60;
          t[END_KEY[key]] = (endMin - base / 60000) / 60;
          t[ALL_DAY_KEY[key]] = false;
          el.classList.remove("allday");
          item.y = yOf(base + t[key] * H);
          const timeSpan = el.querySelector(".row2 span");
          if (timeSpan) timeSpan.textContent = chipTimeText(t, key);
          applyChipSpanHeight(item);
        } else {
          restore();
          toast("改期失败：" + ((res && res.error) || "未知错误"));
        }
        layoutLane(key);
        return;
      }

      const minutes = snapMs(tsAtPoint(pointerY) - grabTs, false) / 60000;
      if (!minutes) {
        el.style.opacity = "";
        restore();
        return;
      }
      const res = await api.reschedule(t.id, TRACK_PROP[key], minutes);
      el.style.opacity = "";
      if (res && res.ok && res.task) {
        const hours = res.task[key];
        if (typeof hours === "number") {
          t[key] = hours;
          t[ALL_DAY_KEY[key]] = !!res.task[ALL_DAY_KEY[key]];
          // 整卡平移：结束时刻跟着走，保持时长
          if (typeof res.task[END_KEY[key]] === "number") {
            t[END_KEY[key]] = res.task[END_KEY[key]];
          }
          item.y = yOf(base + hours * H);
          applyChipSpanHeight(item);
          const timeSpan = el.querySelector(".row2 span");
          if (timeSpan) {
            timeSpan.textContent = chipTimeText(t, key);
          }
          const late = key === "due" && base + hours * H < nowTs && t.status !== "done";
          el.classList.toggle("overdue", late);
        }
      } else {
        restore();
        toast("改期失败：" + ((res && res.error) || "未知错误"));
      }
      layoutLane(key);
    };

    window.addEventListener("keydown", onKey, true);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onCancel);
    window.addEventListener("blur", onCancel);
    scroll.addEventListener("scroll", onScroll, { passive: true });
  }

  function mountChip(t, key) {
    if (typeof t[key] !== "number") return null;
    const ts = base + t[key] * H;
    const late = key === "due" && ts < nowTs && t.status !== "done";

    const el = document.createElement("div");
    el.className = "chip" + (late ? " overdue" : "") + (t.status === "done" ? " done" : "");
    el.style.top = yOf(ts) + "px";
    el.dataset.id = t.id;
    el.dataset.status = t.status || "";
    el.innerHTML = chipHtml(t, key, ts, late);
    if (key === "sched" ? t.allDaySched : t.allDayDue) el.classList.add("allday");

    const linkBtn = el.querySelector(".link");
    if (linkBtn) {
      linkBtn.addEventListener("pointerdown", e => {
        e.preventDefault();     // 别让按钮抢焦点：否则会 scrollIntoView，时间轴会跳
        e.stopPropagation();    // 也别启动拖拽
      });
      linkBtn.addEventListener("click", e => {
        e.stopPropagation();
        e.preventDefault();
        const api = bridge();
        if (api) api.open_task(t.id);
      });
    }
    el.addEventListener("click", e => {
      e.stopPropagation();
      if (Date.now() - (el._dragEndedAt || 0) < 300) return;  // 拖拽刚结束，不当点击
      document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
      el.classList.add("sel");
      openDetail(t, key, el);
    });
    el.addEventListener("dblclick", () => {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.open_task(t.id);
    });
    /* hover 200ms 预取正文：点击打开时直接命中缓存 */
    let prefetchTimer = null;
    el.addEventListener("mouseenter", () => {
      clearTimeout(prefetchTimer);
      prefetchTimer = setTimeout(() => {
        const api = bridge();
        if (api && api.prefetch_content) api.prefetch_content(t.id);
      }, 200);
    });
    el.addEventListener("mouseleave", () => clearTimeout(prefetchTimer));
    el.addEventListener("contextmenu", e => {
      e.preventDefault();
      e.stopPropagation();
      openCtx(e.clientX, e.clientY, t, el.dataset.status || "");
    });
    el.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;                            // 只认左键
      if (e.target.closest(".dot, button, input, .hedge")) return;  // 控件/上下沿不参与整卡拖拽
      startDrag(e, el, t, key);
    });
    el.querySelectorAll(".hedge").forEach(handle => {
      handle.addEventListener("click", e => e.stopPropagation());
      handle.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        startEdgeDrag(e, el, t, key, handle.dataset.edge);
      });
    });

    lanes[key].appendChild(el);
    const item = { el, y: yOf(ts), h: el.offsetHeight, t, key };
    applyChipSpanHeight(item);
    return item;
  }

  function updateEmptyHint() {
    const hint = document.getElementById("emptyHint");
    if (!hint) return;
    const track = document.getElementById("timeline").dataset.track;
    const shown = items[track].filter(it => it.el.isConnected && !it.el.classList.contains("hide"));
    hint.classList.toggle("on", shown.length === 0);
  }

  /* 小时刻度分档：>=10 小时线；>=18 每 6h 标签；>=28 每 3h；>=36 每小时（00–23）；
     >=120 再加半小时线。标签最小间距 16px * 字号缩放，冲突就隔一个。 */
  const HOUR_LABEL_GAP = 16;
  function rebuildHourTicks() {
    hourLayer.innerHTML = "";
    if (PX_PER_HOUR < 10) return;
    const step = PX_PER_HOUR >= 120 ? 0.5 : 1;       // 120 档半小时一条线
    let labelEvery = PX_PER_HOUR >= 36 ? 1 : (PX_PER_HOUR >= 28 ? 3 : (PX_PER_HOUR >= 18 ? 6 : 0));
    while (labelEvery && labelEvery * PX_PER_HOUR < HOUR_LABEL_GAP * FONT_SCALE) labelEvery *= 2;
    const totalHours = DAYS * 24;
    for (let i = 1; i < totalHours / step; i++) {
      const h = i * step;
      const midnight = Math.abs(h % 24) < 1e-9;
      const y = h * PX_PER_HOUR;
      if (!midnight) {                       // 日界已有 dayline，不画重复线
        const line = document.createElement("div");
        line.className = "hourline" + (h % 1 ? " half" : "");
        line.style.top = y + "px";
        hourLayer.appendChild(line);
      }
      if (labelEvery && Math.abs(h % labelEvery) < 1e-9) {
        const label = document.createElement("div");
        label.className = "hourlabel" + (midnight ? " midnight" : "");
        label.style.top = y + "px";
        label.textContent = String(Math.round(h) % 24).padStart(2, "0");
        hourLayer.appendChild(label);
      }
    }
  }

  function layoutLane(key) {
    lanes[key].querySelectorAll(".tick").forEach(node => node.remove());
    // items 保留全部（搜索过滤后还要能恢复），只有可见的参与堆叠
    const list = items[key].filter(it => it.el.isConnected);
    items[key] = list;
    const shown = list.filter(it => !it.el.classList.contains("hide"))
      .sort((a, b) => a.y - b.y);
    let cursor = -Infinity;

    shown.forEach(it => {
      const top = Math.max(it.y, cursor);
      it.el.style.top = top + "px";
      it.el.style.left = "7px";
      it.el.style.right = "auto";
      cursor = top + it.h + 4;

      if (top > it.y + 2) {
        const tick = document.createElement("span");
        tick.className = "tick";
        tick.style.top = it.y + "px";
        tick.style.background = key === "due" ? "var(--due)" : "var(--sched)";
        lanes[key].appendChild(tick);
      }
    });
    updateEmptyHint();
  }

  function jumpToEarliestOverdue() {
    if (!earliestOverdue) return;
    setTrack("due");

  function renderSummary() {
    const todayStart = base, todayEnd = base + DAY;

    earliestOverdue = null;
    tasks.forEach(t => {
      if (t.status === "done") return;
      const stamps = [t.sched, t.due].filter(v => typeof v === "number").map(v => base + v * H);
      if (stamps.some(ts => ts >= todayStart && ts < todayEnd)) todayCount++;
      if (typeof t.due === "number" && base + t.due * H < nowTs) {
        overdueCount++;
        if (!earliestOverdue || t.due < earliestOverdue.due) earliestOverdue = t;
      }
    });

      "今天 <b>" + todayCount + "</b> 项 · 逾期 " +
      '<b class="warn' + (earliestOverdue ? " clickable" : "") + '" id="overduePill"' +
      (earliestOverdue ? ' role="button" tabindex="0" title="跳到最早逾期的一项"' : "") +
      ">" + overdueCount + "</b> 项";

  /* now 标记写进 canvas：随内容滚动，每 30s 刷新位置与时间 */
  const nowlineEl = document.getElementById("nowline");
  const nowbadgeEl = document.querySelector(".nowbadge");

  canvas.appendChild(nowbadgeEl);                // 徽标在最上面

  setInterval(updateNowMarker, 30_000);
  requestAnimationFrame(() => scrollToNow(false));

  /* 空格：回到当前时间（输入框/按钮/弹窗/拖拽/改键时不抢） */
  window.addEventListener("keydown", e => {
    if (e.code !== "Space" || e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
    const el = document.activeElement;
    if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(el.tagName))) return;
    if (document.getElementById("hotkeyRow").classList.contains("capturing")) return;
    if (dragActive || resizing) return;
    /* 弹窗开着：吃掉默认滚动，但也别把时间轴拉回去 */
    if (document.getElementById("detail").classList.contains("open") ||
        document.getElementById("modal").classList.contains("open")) {
      e.preventDefault();
      return;
    }
    e.preventDefault();
    scrollToNow(false);

  /* 刷新数据（按钮 / 托盘共用）：保持当前视口中线时刻 */
  async function refreshData() {
    const api = bridge();
    if (!api || !api.reload_data) { scrollToNow(true); return null; }
    const centerTs = tsAtPoint(scroll.getBoundingClientRect().top + scroll.clientHeight / 2);
    const res = await api.reload_data();
    if (res && res.data) {
      tasks.length = 0;
      tasks.push(...(res.data.tasks || []));
      undated.length = 0;
      undated.push(...(res.data.undated || []));
      if (res.data.options) window.__DATA__ = Object.assign({}, window.__DATA__ || {}, res.data);
      renderTimeline();
      scroll.scrollTop = Math.max(
        0, ((centerTs - canvasStart) / 60000) * PX_PER_MIN - contentHalfViewport());
      if (res.error) console.warn("刷新回落：", res.error);
    }
    return res;
  }
  window.__hudRefreshData = refreshData;      // 托盘调 __hud.refresh() 时用

  document.getElementById("btnRefresh").addEventListener("click", async () => {
    const btn = document.getElementById("btnRefresh");
    btn.classList.add("spinning");

      if (!res.data) toast("刷新失败：" + ((res && res.error) || "未知错误"));

  /* ---------- 字号缩放 ---------- */
  function updateFontLabel() {
    const label = document.getElementById("fontValue");
    if (label) label.textContent = Math.round(FONT_SCALE * 100) + "%";
  }

  function applyFontScale(value) {
    // 先记下视口中线对应的时刻，改完字号再滚回同一时刻
    const centerTs = tsAtPoint(scroll.getBoundingClientRect().top + scroll.clientHeight / 2);

    FONT_SCALE = clampFont(value);
    document.documentElement.style.setProperty("--font-scale", String(FONT_SCALE));
    updateFontLabel();
    rebuildHourTicks();        // 字号变了，标签最小间距跟着变
    // 字变了 → 卡片高度变了，重新量高并重排（不影响 px/hour）
    ["sched", "due"].forEach(key => {
      items[key].forEach(item => applyChipSpanHeight(item));
      layoutLane(key);
    });

    const anchor = ((centerTs - canvasStart) / 60000) * PX_PER_MIN - contentHalfViewport();
    scroll.scrollTop = Math.max(0, anchor);
    return FONT_SCALE;
  }

  /* ---------- 时间轴密度（px/hour） ---------- */
  /* 滑块走对数：0~100 → 6~480，低密度段每格变化小，高密度段也能推得动 */
  const SCALE_SLIDER_MAX = 100;
  function scaleFromSlider(pos) {
    const t = Math.min(1, Math.max(0, Number(pos) / SCALE_SLIDER_MAX));
    return SCALE_MIN * Math.pow(SCALE_MAX / SCALE_MIN, t);
  }
  function sliderFromScale(px) {
    const t = Math.log(Math.max(SCALE_MIN, px) / SCALE_MIN) / Math.log(SCALE_MAX / SCALE_MIN);
    return Math.round(Math.min(1, Math.max(0, t)) * SCALE_SLIDER_MAX);
  }

  function updateScaleLabel() {
    const label = document.getElementById("scaleValue");
    if (label) {
      const shown = Number.isInteger(PX_PER_HOUR) ? String(PX_PER_HOUR) : PX_PER_HOUR.toFixed(1);
      label.textContent = shown + " px/h";
    }
    const sliderEl = document.getElementById("scaleSlider");
    if (sliderEl) sliderEl.value = String(sliderFromScale(PX_PER_HOUR));
  }

  /* 真正落地的缩放：锚点时刻由调用方固定，连续缩放不会累积漂移 */
  function applyScaleTo(target, anchorTs, anchorY) {
    target = clampScale(target);
    if (dragActive) return PX_PER_HOUR;   // 拖拽中不缩放（见 dragActive 注释）
    if (target === PX_PER_HOUR) return PX_PER_HOUR;

    PX_PER_HOUR = target;
    PX_PER_MIN = target / 60;

    canvas.style.height = timelineHeight() + "px";
    dayMarks.forEach(mark => {
      const y = mark.index * 24 * PX_PER_HOUR;
      mark.line.style.top = y + "px";
      mark.label.style.top = y + "px";
    });
    rebuildHourTicks();
    updateNowMarker();          // 缩放后按新比例重算，别让 now 线留在旧位置
    ["sched", "due"].forEach(key => {
      items[key].forEach(item => {
        applyChipSpanHeight(item);
        item.y = yOf(base + item.t[item.key] * H);
      });
      layoutLane(key);   // 重算避让与 tick
    });
    const rect = scroll.getBoundingClientRect();
    const fromTop = (typeof anchorY === "number")
      ? Math.min(scroll.clientHeight, Math.max(0, anchorY - rect.top)) * canvasYRatio()
      : contentHalfViewport();
    scroll.scrollTop = Math.max(0, ((anchorTs - canvasStart) / 60000) * PX_PER_MIN - fromTop);
    updateScaleLabel();
    return PX_PER_HOUR;
  }

  /* 滑杆/重置等一次性缩放：先按当前状态算锚点，再交给 applyScaleTo */
  function applyScale(next, anchorY) {
    const target = clampScale(next);
    if (dragActive || target === PX_PER_HOUR) return PX_PER_HOUR;
    const rect = scroll.getBoundingClientRect();
    const fromTop = (typeof anchorY === "number")
      ? Math.min(scroll.clientHeight, Math.max(0, anchorY - rect.top)) * canvasYRatio()
      : contentHalfViewport();
    const anchorTs = canvasStart + ((scroll.scrollTop + fromTop) / PX_PER_MIN) * 60000;
    return applyScaleTo(target, anchorTs, anchorY);
  }

  /* Ctrl+滚轮：几何累加目标值，每帧最多落地一次；锚点整段手势固定 */
  let wheelRaf = 0;
  let wheelTarget = 0;
  let wheelAnchorTs = 0;
  let wheelAnchorY = 0;
  let wheelIdle = 0;

  function queueWheelZoom(deltaY, clientY) {
    if (!wheelAnchorTs) {
      wheelAnchorY = clientY;
      wheelAnchorTs = tsAtPoint(clientY);   // 手势开始时指针下的时刻
      wheelTarget = PX_PER_HOUR;
    }
    const factor = deltaY < 0 ? SCALE_WHEEL_FACTOR : 1 / SCALE_WHEEL_FACTOR;
    wheelTarget = clampScale(wheelTarget * factor);
    clearTimeout(wheelIdle);
    wheelIdle = setTimeout(() => { wheelTarget = 0; wheelAnchorTs = 0; }, 160);
    if (wheelRaf) return;
    wheelRaf = requestAnimationFrame(() => {
      wheelRaf = 0;
      if (wheelTarget) applyScaleTo(wheelTarget, wheelAnchorTs, wheelAnchorY);
    });
  }

  /* 隐藏后回默认值；居中到 now */
  function resetScale() {
    applyScale(DEFAULT_SCALE);
    requestAnimationFrame(() => scrollToNow(false));
  }

  updateScaleLabel();

  const settings = document.getElementById("settings");
  document.getElementById("btnSettings").addEventListener("click", e => {

  /* ---------- 设置项：落 config.json，失败回滚 UI ---------- */
  const slider = document.getElementById("opacitySlider");

  function paintDock(side) {

      btn.classList.toggle("on", btn.dataset.side === target));

  function paintSlider(percent) {
    slider.style.background =
      "linear-gradient(90deg, var(--accent) " + percent + "%, rgba(255,255,255,.14) " + percent + "%)";
  }

  /* 滑块 → --panel-alpha（遮罩层跟着变）+ 百分比文案 */
  function applyOpacity(percent) {
    const value = Math.max(20, Math.min(95, Math.round(Number(percent) || 82)));
    const alpha = value / 100;
    document.documentElement.style.setProperty("--panel-alpha", alpha.toFixed(2));
    const label = document.getElementById("opacityValue");
    if (label) label.textContent = value + "%";
    if (String(slider.value) !== String(value)) slider.value = String(value);
    paintSlider(value);
    return alpha;
  }
  applyOpacity(slider.value);

  let opacityTimer = null;
  slider.addEventListener("input", () => {
    applyOpacity(slider.value);
    clearTimeout(opacityTimer);
    opacityTimer = setTimeout(saveOpacity, 150);   // 亚克力重设比较贵，压一压
  });

  async function saveOpacity() {
    const alpha = Number(slider.value) / 100;
    const previous = Number(slider.dataset.saved || 82) / 100;
    const api = bridge();
    if (!api) return;
    if (api.set_panel_opacity) api.set_panel_opacity(alpha);   // 亚克力 tint 跟着走
    const res = await setConfig({ opacity: alpha });
    if (res && res.ok) {
      slider.dataset.saved = String(Math.round(alpha * 100));

  const scaleSlider = document.getElementById("scaleSlider");

  scaleSlider.addEventListener("input", () => {
    const value = clampScale(scaleFromSlider(scaleSlider.value));
    DEFAULT_SCALE = value;      // 滑块 = 新的默认密度
    applyScale(value);          // 即时生效
    clearTimeout(scaleSaveTimer);
    scaleSaveTimer = setTimeout(async () => {
      if (!bridge()) return;
      const res = await setConfig({ timeline_scale: value });
      if (!res || !res.ok) {
        toast("密度没保存上：" + ((res && res.error) || "未知错误"));
        if (res && res.config) {
          DEFAULT_SCALE = clampScale(res.config.timeline_scale);

  /* ---------- 首次引导 ---------- */
  const introBar = document.getElementById("introBar");

  /* ---------- 快捷键编辑 ---------- */
  const hotkeyRow = document.getElementById("hotkeyRow");
  const hotkeyCapture = document.getElementById("hotkeyCapture");
  const hotkeyHint = document.getElementById("hotkeyHint");
  let capturing = false;

  function hotkeyName(ev) {
    const k = ev.key;
    if (k === " ") return "Space";
    const named = {
      Escape: "Esc", Enter: "Enter", Tab: "Tab", Backspace: "Backspace", Delete: "Delete",
      Insert: "Insert", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
      ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down"
    };
    if (named[k]) return named[k];
    if (/^[a-zA-Z]$/.test(k)) return k.toUpperCase();
    if (/^[0-9]$/.test(k)) return k;
    if (/^F([1-9]|1[0-2])$/.test(k)) return k;
    if (["`", "-", "="].includes(k)) return k;
    return null;
  }

  function showHotkeyHint(text) {
    hotkeyHint.textContent = text || "";
    hotkeyHint.classList.toggle("on", !!text);
  }

  function renderHotkey(text) {
    hotkeyKeys.innerHTML = String(text || "")
      .split("+").filter(Boolean)
      .map(k => "<kbd>" + k.trim() + "</kbd>").join("");
  }

  function stopCapture() {
    capturing = false;
    hotkeyRow.classList.remove("capturing");
    window.removeEventListener("keydown", onCaptureKey, true);
  }

  function startCapture() {
    if (capturing) return;
    capturing = true;
    showHotkeyHint("");
    hotkeyRow.classList.add("capturing");
    window.addEventListener("keydown", onCaptureKey, true);
  }

  async function onCaptureKey(ev) {
    ev.preventDefault();
    ev.stopPropagation();          // 捕获期间不触发全局 Esc / Delete 等
    if (!capturing) return;

    if (ev.key === "Escape") { stopCapture(); return; }
    if (["Shift", "Control", "Alt", "Meta"].includes(ev.key)) return;   // 只按修饰键不算

    const key = hotkeyName(ev);
    if (!key) { showHotkeyHint("这个键不支持，换一个（字母/数字/F1-F12/空格等）"); return; }

    const parts = [];
    if (ev.ctrlKey) parts.push("Ctrl");
    if (ev.altKey) parts.push("Alt");
    if (ev.shiftKey) parts.push("Shift");
    if (ev.metaKey) parts.push("Win");
    if (!parts.length) { showHotkeyHint("至少带一个修饰键（Ctrl / Alt / Shift / Win）"); return; }

    const combo = parts.concat([key]).join("+");
    const previous = hotkeyRow.dataset.saved || "";
    const api = bridge();
    stopCapture();
    if (!api) { showHotkeyHint("浏览器预览不能改快捷键"); return; }
    const res = await setConfig({ hotkey: combo });
    if (res && res.ok) {
      hotkeyRow.dataset.saved = combo;
      renderHotkey(combo);
      showHotkeyHint("");
    } else {
      renderHotkey(previous);
      showHotkeyHint("没改成：" + ((res && res.error) || "未知错误"));
    }
  }

  hotkeyRow.addEventListener("click", e => {
    e.stopPropagation();
    startCapture();
  });

  swOpenInApp.addEventListener("click", async e => {
    e.stopPropagation();
    const target = !swOpenInApp.classList.contains("on");
    swOpenInApp.classList.toggle("on", target);   // 先动，失败回滚

  document.getElementById("btnQuit").addEventListener("click", async e => {

  const btnFontDec = document.getElementById("btnFontDec");

  async function syncConfig() {

  /* ---------- 轨道切换 ---------- */
  const timelineEl = document.getElementById("timeline");

  /* Ctrl + 滚轮：改密度（吃掉 WebView2 的页面缩放）；普通滚轮照常滚动 */
  timelineEl.addEventListener("wheel", e => {

  document.getElementById("cntSched").textContent = tasks.filter(t => typeof t.sched === "number").length;

  function setTrack(name) {
    timelineEl.dataset.track = name;
    document.querySelectorAll(".track").forEach(b =>
      b.classList.toggle("on", b.dataset.track === name));

  document.querySelectorAll(".track").forEach(b =>
    b.addEventListener("click", () => setTrack(b.dataset.track)));
  /* ---------- 空白处新建 ---------- */
  let suppressClick = false;
  let suppressClickTimer = 0;
  let phCard = null;

  /* 拖完吞掉紧随其后的那次 click，避免在松手处又建一条 */
  function suppressClickOnce() {
    suppressClick = true;
    clearTimeout(suppressClickTimer);
    suppressClickTimer = setTimeout(() => { suppressClick = false; }, 400);
  }

  function inLaneX(clientX) {
    /* 直接用当前轨道左边界：--gutter 会随字号变宽，不能写死 56 */
    const key = document.getElementById("timeline").dataset.track;
    return clientX >= lanes[key].getBoundingClientRect().left;
  }

  /* clientY → 绝对分钟数（按 15 分钟吸附） */
  function minuteAt(clientY) {
    return snapMinute(yToMinute(clientY));
  }

  function pointOfMinute(min) {
    const d = new Date(min * 60000);
    return {
      date: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
      time: pad(d.getHours()) + ":" + pad(d.getMinutes())
    };
  }

  function closePlaceholder() {
    if (phCard) { phCard.remove(); phCard = null; }
  }

  function openPlaceholder(prop, key, startMin, endMin) {
    closePlaceholder();
    const el = document.createElement("div");
    el.className = "phcard";
    const phTop = yOf(startMin * 60000);
    const phH = endMin ? Math.max(34, (endMin - startMin) * PX_PER_MIN) : 34;
    el.style.top = phTop + "px";
    if (endMin) el.style.height = phH + "px";
    el.style.left = "7px";

    const time = document.createElement("div");
    time.className = "phtime";
    time.textContent = endMin
      ? hhmm(startMin * 60000) + "–" + hhmm(endMin * 60000)
      : hhmm(startMin * 60000);

    const input = document.createElement("input");
    input.className = "phin";
    input.placeholder = "新任务标题";
    input.maxLength = 200;

    const hint = document.createElement("div");
    hint.className = "phhint";
    hint.textContent = "回车保存 · Esc 取消";

    el.append(time, input, hint);
    lanes[key].appendChild(el);
    // 用「已渲染卡片的真实 rect」判重叠（避让会把卡片顶下去，真实 y 不准），同轨才判
    const phRect = el.getBoundingClientRect();
    const clash = items[key].some(it => {
      if (!it.el.isConnected) return false;
      const r = it.el.getBoundingClientRect();
      return phRect.top < r.bottom - 2 && phRect.bottom > r.top + 2;
    });
    if (clash) el.style.left = "15px";     // 向右错开 8px，不改真实时间
    phCard = el;
    requestAnimationFrame(() => input.focus());

    let done = false;
    const cancel = () => {
      if (done) return;
      done = true;
      closePlaceholder();
    };
    const commit = async () => {
      if (done) return;
      const title = input.value.trim();
      if (!title) { cancel(); return; }
      const api = bridge();
      done = true;
      if (!api) { closePlaceholder(); return; }
      el.style.opacity = ".6";
      const res = await api.create_at(
        prop, title, pointOfMinute(startMin), endMin ? pointOfMinute(endMin) : null);
      if (res && res.ok && res.task) {
        closePlaceholder();
        const item = mountChip(res.task, key);
        if (item) {
          items[key].push(item);
          layoutLane(key);
          updateCounts();
          revealChip(item.el);
          markIntroSeen();
        }
      } else {
        done = false;
        el.style.opacity = "";
        toast("创建失败：" + ((res && res.error) || "未知错误"));
        input.focus();
      }
    };

    input.addEventListener("keydown", ev => {
      ev.stopPropagation();
      if (ev.key === "Enter") { ev.preventDefault(); commit(); }
      else if (ev.key === "Escape") { ev.preventDefault(); cancel(); }
    });
    input.addEventListener("blur", () => { if (!input.value.trim()) cancel(); });
    el.addEventListener("pointerdown", ev => ev.stopPropagation());
  }

  /* 新建后的反馈：滚到可见，并短暂选中 */
  function revealChip(el) {
    const rect = el.getBoundingClientRect();
    const box = scroll.getBoundingClientRect();
    if (rect.top < box.top + 40 || rect.bottom > box.bottom - 40) {
      scroll.scrollTop += (rect.top - (box.top + box.height / 2)) * canvasYRatio();
    }
    el.classList.add("sel");
    setTimeout(() => el.classList.remove("sel"), 300);
  }

  /* 单击空白：有弹窗先关，否则建占位卡 */
  scroll.addEventListener("click", e => {
    if (suppressClick) { suppressClick = false; return; }
    if (dragActive || resizing) return;          // 拖拽刚结束的那一帧不建卡
    if (e.target.closest(".chip, .phcard, button, input")) return;
    if (!inLaneX(e.clientX)) return;
    if (detail.classList.contains("open")) { closeDetail(); return; }
    if (settings.classList.contains("open")) { settings.classList.remove("open"); return; }
    if (phCard) return;
    const key = document.getElementById("timeline").dataset.track;
    openPlaceholder(TRACK_PROP[key], key, minuteAt(e.clientY), null);
  });

  /* 拖拽空白：画时间带，松手后建带起止的占位卡 */
  scroll.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    if (dragActive || resizing) return;
    if (e.target.closest(".chip, .phcard, button, input")) return;
    if (!inLaneX(e.clientX)) return;
    startBand(e);
  });

  function startBand(e) {
    const key = document.getElementById("timeline").dataset.track;
    const startClientY = e.clientY;
    const startMin = minuteAt(e.clientY);
    let curMin = startMin;
    let moved = false;
    let band = null;
    let rafId = 0;
    let pendingY = startClientY;
    let resized = false;

    dragActive = true;                 // 禁整卡拖拽 + Ctrl+滚轮缩放 + 空白拖拽
    if (e.pointerId !== undefined && scroll.setPointerCapture) {
      try { scroll.setPointerCapture(e.pointerId); } catch (_err) { /* 忽略 */ }
    }

    const applyBand = () => {
      const dy = pendingY - startClientY;
      curMin = minuteAt(pendingY);
      if (curMin === startMin) curMin = startMin + (dy > 0 ? 15 : -15);   // 最小 15 分钟
      const top = Math.min(startMin, curMin);
      const bottom = Math.max(startMin, curMin);
      band.style.top = yOf(top * 60000) + "px";
      band.style.height = Math.max(4, (bottom - top) * PX_PER_MIN) + "px";
    };

    const schedule = y => {
      pendingY = y;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = 0;
        if (band) applyBand();
      });
    };

    const onMove = ev => {
      if (e.pointerId !== undefined && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      const dy = ev.clientY - startClientY;
      if (!moved) {
        if (Math.abs(dy) < 6) return;
        moved = true;
        resized = true;
        resizing = true;
        band = document.createElement("div");
        band.className = "cband";
        lanes[key].appendChild(band);
        document.body.classList.add("drag-lock");
      }
      schedule(ev.clientY);
    };

    const detach = () => {
      dragActive = false;
      if (resized) holdResizing();
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (e.pointerId !== undefined && scroll.releasePointerCapture) {
        try { scroll.releasePointerCapture(e.pointerId); } catch (_err) { /* 已释放 */ }
      }
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", detach);
      window.removeEventListener("keydown", onKey, true);
      document.body.classList.remove("drag-lock");
      if (band) { band.remove(); band = null; }
    };

    const onKey = ev => {
      if (ev.key !== "Escape") return;
      ev.preventDefault();
      ev.stopPropagation();
      detach();
    };

    const onUp = () => {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (moved && band) applyBand();
      detach();
      if (!moved) return;              // 当成单击，交给 click
      suppressClickOnce();
      const top = Math.min(startMin, curMin);
      const bottom = Math.max(startMin, curMin);
      openPlaceholder(TRACK_PROP[key], key, top, bottom);
    };

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", detach);
    window.addEventListener("keydown", onKey, true);
  }

  /* ---------- 搜索 ---------- */
  const searchBar = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  const searchCount = document.getElementById("searchCount");

  /* 子序列即可命中：中文按字符、英文忽略大小写 */
  function fuzzyHit(query, title) {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const text = String(title || "").toLowerCase();
    if (text.includes(q)) return true;
    let i = 0;
    for (const ch of text) {
      if (ch === q[i]) i++;
      if (i === q.length) return true;
    }
    return false;
  }

  /* 搜索的匹配文本：标题 + 大方向 + 学科 + Tag */
  function searchableText(t) {
    return [t.title, t.dir, t.subject, t.tag].filter(Boolean).join(" ");
  }

  function applySearch(query) {
    const q = query.trim();
    ["sched", "due"].forEach(key => {
      items[key].forEach(it => {
        it.el.classList.toggle("hide", !fuzzyHit(q, searchableText(it.t)));
      });
      layoutLane(key);
    });
    drawerBody.querySelectorAll(".ditem").forEach(row => {
      row.classList.toggle("hide", !!q && !fuzzyHit(q, row.dataset.search || row.textContent));
    });
    const visible = document.querySelectorAll(
      '.lane[data-track="' + timelineEl.dataset.track + '"] .chip:not(.hide)').length;
    searchCount.textContent = q ? visible + " 条" : "";
    updateCounts();
  }

  function openSearch() {
    searchBar.classList.add("open");
    searchInput.focus();
    searchInput.select();
  }

  function closeSearch() {
    searchBar.classList.remove("open");
    searchInput.value = "";

  searchInput.addEventListener("keydown", e => {

  /* ---------- 键盘操作 ---------- */
  let selIndex = -1;

  function laneItems() {
    const key = timelineEl.dataset.track;
    return items[key]
      .filter(it => it.el.isConnected && !it.el.classList.contains("hide"))
      .sort((a, b) => a.y - b.y);
  }

  function selectChipAt(index) {
    const list = laneItems();
    if (!list.length) return null;
    selIndex = Math.max(0, Math.min(list.length - 1, index));
    document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
    const item = list[selIndex];
    item.el.classList.add("sel");
    const rect = item.el.getBoundingClientRect();
    const box = scroll.getBoundingClientRect();
    if (rect.top < box.top + 44 || rect.bottom > box.bottom - 44) {
      scroll.scrollTop += (rect.top - (box.top + box.height / 2)) * canvasYRatio();
    }
    return item;
  }

    return laneItems()[selIndex] || null;

  function openSelected() {
    const item = selectedItem() || selectChipAt(0);
    if (!item) return;
    openDetail(item.t, timelineEl.dataset.track, item.el);

  async function deleteSelected() {
    const item = selectedItem();
    if (!item || !item.el.isConnected) return;
    const t = item.t;
    const okDelete = await askConfirm({
      title: "删除任务？",
      text: "「" + t.title + "」会移入 Notion 回收站，30 天内可恢复。",
      okText: "删除", danger: true,
    });
    if (!okDelete) return;
    const api = bridge();
    if (!api) return;
    const res = await api.delete_task(t.id);
    if (res && res.ok) {

      selIndex = Math.max(0, Math.min(selIndex, laneItems().length - 1));

  window.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (searchBar.classList.contains("open")) { closeSearch(); return; }
      closeDetail();
      document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
      selIndex = -1;
      return;
    }
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.target && e.target.isContentEditable) return;   // 正文块正在编辑

    if (e.key === "ArrowLeft") { setTrack("sched"); selIndex = -1; return; }

  function dateRow(name) {

  function setRow(name, hours, allDay) {
    const row = dateRow(name);
    const dateEl = row.querySelector(".ddate");
    const timeEl = row.querySelector(".dtime");

  const EDITABLE_BLOCKS = new Set(["paragraph", "heading_1", "heading_2", "heading_3",
    "bulleted_list_item", "numbered_list_item", "quote", "callout", "code", "toggle", "to_do"]);

  function renderBlock(block, numIndex) {
    const el = document.createElement("div");
    el.className = "blk" + (block.type === "to_do" && block.checked ? " done" : "");
    el.dataset.type = block.type;
    if (block.id) el.dataset.id = block.id;
    if (block.level > 1) el.style.paddingLeft = ((block.level - 1) * 12) + "px";
    if (block.type === "numbered_list_item") el.dataset.index = String(numIndex);

    if (block.type === "to_do") {
      const box = document.createElement("span");
      box.className = "bcheck";
      box.textContent = block.checked ? "☑" : "☐";
      box.title = "勾选 / 取消";
      box.addEventListener("click", e => { e.stopPropagation(); toggleTodo(el, block); });
      el.appendChild(box);
    }

    const txt = document.createElement("span");
    txt.className = "btxt";
    txt.textContent = block.type === "divider" ? "" : (block.text || "");
    el.appendChild(txt);

    if (EDITABLE_BLOCKS.has(block.type) && block.id) {
      txt.addEventListener("click", e => {
        e.stopPropagation();
        startEdit(el, block, txt);
      });
    }

    const del = document.createElement("button");
    del.className = "bdel";
    del.textContent = "×";
    del.title = "删除这一块（移到回收站）";
    del.addEventListener("click", e => { e.stopPropagation(); removeBlock(el, block); });
    el.appendChild(del);

    block._el = el;
    block._txt = txt;
    return el;
