<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline HUD · 外观稿 v2</title>
<style>
  :root {
    /* 面板底色拆成 rgb + alpha，透明度滑杆只改 --panel-alpha，不动配色 */
    --panel-rgb: 16, 17, 22;
    --panel-alpha: 0.82;
    --font-scale: 1;          /* 条目字号缩放，和时间轴密度无关 */
    --panel-line: rgba(255, 255, 255, 0.09);
    --text: #ECECF1;
    --dim: #8E8F9C;
    --faint: #5C5E6C;
    --accent: #7C8CFF;
    --due: #FF6B8A;
    --sched: #7C8CFF;
    --todo: #6B7280;
    --doing: #F5A524;
    --done: #30C48D;
    --empty: #3F4550;
    --gutter: 56px;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI Variable Text", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #08090D;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- 假桌面 ---------------- */
  .desk { position: fixed; inset: 0; overflow: hidden; }

  .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
  .b1 { width: 640px; height: 640px; left: -180px; top: -200px;
        background: radial-gradient(circle, #2C3C82 0%, transparent 68%); opacity: .62; }
  .b2 { width: 520px; height: 520px; right: 120px; top: -60px;
        background: radial-gradient(circle, #5A2350 0%, transparent 68%); opacity: .5; }
  .b3 { width: 720px; height: 520px; left: 34%; bottom: -300px;
        background: radial-gradient(circle, #0F4952 0%, transparent 68%); opacity: .55; }
  .b4 { width: 460px; height: 460px; right: 180px; bottom: 40px;
        background: radial-gradient(circle, #6B4A1E 0%, transparent 70%); opacity: .38; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 60% 45%, #000 26%, transparent 76%);
  }

  .fake-win {
    position: absolute;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.042);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 34px 90px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .fake-win .bar {
    height: 30px; background: rgba(255,255,255,.035);
    border-bottom: 1px solid rgba(255,255,255,.05);
    display: flex; align-items: center; gap: 5px; padding-left: 12px;
  }
  .fake-win .bar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .lines { position: absolute; left: 22px; top: 50px; right: 22px; display: grid; gap: 11px; }
  .lines i { display: block; height: 7px; border-radius: 3px; background: rgba(255,255,255,.055); }
  .lines i:nth-child(2n) { width: 62%; }
  .lines i:nth-child(3n) { width: 84%; }
  .lines i:nth-child(4n) { width: 46%; background: rgba(124,140,255,.16); }

  .w1 { width: 560px; height: 430px; left: 52px; top: 128px; }
  .w2 { width: 470px; height: 320px; right: 42px; bottom: 56px; opacity: .85; }
  /* 正对着面板的一块亮窗，用来体现玻璃透光 */
  .w3 {
    width: 520px; height: 560px; right: 108px; top: 176px;
    background: rgba(255,255,255,.055);
  }
  .w3 .lines { top: 58px; }
  .w3 .lines i { height: 9px; background: rgba(255,255,255,.09); }
  .w3 .lines i:nth-child(4n) { background: rgba(255,107,138,.22); }

  .mock-tag {
    position: fixed; left: 26px; top: 24px;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(255,255,255,.3);
    display: flex; align-items: center; gap: 8px;
  }
  .mock-tag span.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ---------------- 面板 ---------------- */
  .panel {
    position: fixed;
    right: max(80px, calc(50vw - 640px));
    top: 50%;
    transform: translateY(-50%);
    width: 460px;
    height: 720px;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    /* 纵向渐变遮罩：压住中部正文区，保证任意壁纸下正文都够看 */
    background:
      linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.10) 50%, rgba(0,0,0,.16)),
      rgba(var(--panel-rgb), var(--panel-alpha));
    border: 1px solid var(--panel-line);
    backdrop-filter: blur(26px) saturate(165%) brightness(1.06);
    -webkit-backdrop-filter: blur(26px) saturate(165%) brightness(1.06);
    box-shadow:
      0 50px 120px -30px rgba(0,0,0,.9),
      0 0 0 1px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
    animation: rise .34s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(-50% + 14px)) scale(.985); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
  }

  /* ---------------- 顶栏 ---------------- */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 17px 14px 11px 18px;
    flex: none;
  }
  .date-line { display: flex; align-items: baseline; gap: 8px; }
  .date-line .d { font-size: 17.5px; font-weight: 600; letter-spacing: .3px; }
  .date-line .w {
    font-size: 10.5px; color: var(--dim);
    background: rgba(255,255,255,.06);
    padding: 2px 7px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .sub { margin-top: 5px; font-size: 11.5px; color: var(--dim); letter-spacing: .2px; }
  .sub b { color: #CFD0D9; font-weight: 500; }
  .sub .warn { color: #FF9AAE; }
  .sub .warn.clickable {
    cursor: pointer; padding: 1px 6px; border-radius: 5px;
    background: rgba(255,107,138,.14); border: 1px solid rgba(255,107,138,.26);
    transition: background .14s;
  }
  .sub .warn.clickable:hover { background: rgba(255,107,138,.26); }
  .chip.flash { animation: chipflash 1.3s ease; }
  @keyframes chipflash {
    0%, 55% { border-color: rgba(255,107,138,.85); box-shadow: 0 0 0 2px rgba(255,107,138,.5); }
    100% { border-color: rgba(255,255,255,.065); box-shadow: none; }
  }

  .actions { display: flex; gap: 2px; align-items: center; }
  .fontbtn { width: 24px; font-size: 11px; font-weight: 600; letter-spacing: 0; }
  .fontval {
    font-size: 9px; font-weight: 400; color: var(--faint);
    min-width: 30px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .iconbtn {
    width: 28px; height: 28px; border: 0; border-radius: 8px;
    background: transparent; color: var(--dim);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .iconbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .iconbtn svg { width: 15px; height: 15px; stroke: currentColor; fill: none;
                 stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------------- 快速新增 ---------------- */
  .quickadd {
    flex: none;
    margin: 0 14px 8px;
    height: 40px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 11px;
    border-radius: 11px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.075);
    transition: border-color .18s, background .18s;
  }
  .quickadd:focus-within { border-color: rgba(124,140,255,.5); background: rgba(124,140,255,.08); }
  .quickadd .plus { color: var(--faint); font-size: 15px; line-height: 1; }
  .quickadd input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 12.5px; font-family: inherit; letter-spacing: .2px;
  }
  .quickadd input::placeholder { color: var(--faint); }
  .quickadd kbd {
    font-family: inherit; font-size: 10px; color: var(--faint);
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.045);
    padding: 2px 5px; border-radius: 5px;
  }

  /* ---------------- 搜索 ---------------- */
  .search {
    display: none; flex: none; align-items: center; gap: 8px;
    margin: 0 14px 8px; height: 32px; padding: 0 11px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(124,140,255,.32);
  }
  .search.open { display: flex; }
  .search input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 12px; font-family: inherit;
  }
  .search input::placeholder { color: var(--faint); }
  .search .cnt { font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .search kbd {
    font-family: inherit; font-size: 10px; color: var(--faint);
    border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.045);
    padding: 2px 5px; border-radius: 5px;
  }
  .chip.hide, .ditem.hide { display: none; }
  body.theme-light .search { background: rgba(0,0,0,.05); border-color: rgba(124,140,255,.4); }
  body.theme-light .search input { color: #1B1C22; }

  /* ---------------- 时间线 ---------------- */
  .timeline { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  .gutterbg {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--gutter); z-index: 3;
    background: linear-gradient(90deg, rgba(11,12,16,.55), rgba(11,12,16,.28));
    border-right: 1px solid rgba(255,255,255,.045);
    pointer-events: none;
  }

  .trackbar {
    position: absolute; top: 0; left: var(--gutter); right: 0; height: 34px; z-index: 6;
    display: flex; align-items: center; gap: 5px; padding: 0 10px;
    backdrop-filter: blur(14px);
    background: linear-gradient(rgba(14,15,20,.95), rgba(14,15,20,.6) 74%, transparent);
    border-bottom: 1px solid rgba(255,255,255,.05);
    pointer-events: none;
  }
  .trackbar::after {
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 20px;
    background: linear-gradient(rgba(14,15,20,.88), rgba(14,15,20,.3) 55%, transparent);
  }
  .track {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 5px;
    height: 23px; padding: 0 9px; border-radius: 7px;
    border: 1px solid transparent; background: transparent;
    color: var(--faint); font-family: inherit; font-size: 11px; letter-spacing: .08em;
    cursor: pointer; transition: color .16s, background .16s, border-color .16s;
  }
  .track i { width: 5px; height: 5px; border-radius: 50%; opacity: .55; }
  .track[data-track="sched"] i { background: var(--sched); }
  .track[data-track="due"] i   { background: var(--due); }
  .track b {
    font-weight: 500; font-size: 9px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .track:hover { color: var(--dim); background: rgba(255,255,255,.045); }
  .track.on {
    color: #E9E9EF; background: rgba(255,255,255,.075);
    border-color: rgba(255,255,255,.09);
  }
  .track.on i { opacity: 1; }
  .track.on[data-track="sched"] i { box-shadow: 0 0 7px rgba(124,140,255,.85); }
  .track.on[data-track="due"] i   { box-shadow: 0 0 7px rgba(255,107,138,.85); }
  .track-hint {
    margin-left: auto; font-size: 9.5px; color: var(--faint); letter-spacing: .04em;
  }

  .scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .scroll::-webkit-scrollbar { display: none; }

  .canvas { position: relative; }

  .dayline {
    position: absolute; left: var(--gutter); right: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.022) 62%, transparent);
  }
  .daylabel {
    position: absolute; left: 0; width: var(--gutter);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transform: translateY(-50%);
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    z-index: 4;
  }
  .daylabel .row { display: flex; align-items: baseline; gap: 2px; }
  .daylabel .num { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
  .daylabel .wd  { font-size: 9px; letter-spacing: .04em; }
  .daylabel.today { transform: translateY(2px); }
  .daylabel.today .num { color: var(--accent); }
  .daylabel.today .wd  { color: rgba(124,140,255,.75); }
  .today-pill {
    font-size: 8px; letter-spacing: .1em;
    color: #BCC4FF; background: rgba(124,140,255,.17);
    border: 1px solid rgba(124,140,255,.28);
    padding: 1px 5px; border-radius: 4px;
    line-height: 1.3;
  }

  .lane {
    position: absolute; top: 0; bottom: 0;
    left: var(--gutter); right: 8px;
    transition: opacity .18s ease;
  }
  .lane[data-track="sched"] {
    background: linear-gradient(180deg, rgba(124,140,255,.03), rgba(124,140,255,.008));
  }
  .lane[data-track="due"] {
    background: linear-gradient(180deg, rgba(255,107,138,.026), rgba(255,107,138,.006));
  }
  .timeline[data-track="sched"] .lane[data-track="due"],
  .timeline[data-track="due"] .lane[data-track="sched"] {
    opacity: 0; pointer-events: none;
  }

  /* ---------------- 任务卡 ---------------- */
  .chip {
    position: absolute;
    width: fit-content;
    min-width: 156px;
    max-width: calc(100% - 14px);
    padding: 4px 7px 5px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.065);
    border-left: 2px solid var(--lane-color, var(--accent));
    cursor: default;
    user-select: none;
    min-height: calc(30px * var(--font-scale, 1));
    transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s;
  }
  .chip:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,.085);
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.8);
    z-index: 20 !important;
  }
  .chip.sel {
    background: rgba(124,140,255,.15);
    border-color: rgba(124,140,255,.45);
    box-shadow: 0 0 0 1px rgba(124,140,255,.28), 0 10px 22px -10px rgba(0,0,0,.85);
    z-index: 21 !important;
  }
  .chip.overdue { opacity: .62; }
  .chip.done .t { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.28); color: #9B9CA6; }

  .chip .row1 { display: flex; align-items: flex-start; gap: 5px; }
  .dot {
    flex: none; width: 6px; height: 6px; border-radius: 50%;
    margin-top: 4px;
    background: var(--empty);
  }
  .dot.todo  { background: var(--todo); }
  .dot.doing { background: var(--doing); box-shadow: 0 0 6px rgba(245,165,36,.55); }
  .dot.done  { background: var(--done); }

  .chip .t {
    font-size: calc(12px * var(--font-scale, 1)); line-height: 1.32; letter-spacing: .1px;
    color: #E6E6EC;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .chip .row2 {
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px; padding-left: 11px;
    font-size: calc(9px * var(--font-scale, 1)); color: var(--faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
  }
  .chip .row2 .tag {
    color: #7A7C8D;
    background: rgba(255,255,255,.055);
    padding: 0 4px; border-radius: 3px;
    max-width: 62px; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .late { color: #FF8FA3; letter-spacing: .01em; }
  /* 外链按钮：绝对定位，不参与文字排版（hover 才出现） */
  .chip .link {
    position: absolute; right: 3px; top: 3px;
    width: 16px; height: 16px; padding: 0; line-height: 15px;
    border: 0; border-radius: 5px; text-align: center;
    background: rgba(18,19,24,.82); color: #C9CAD6;
    font-family: inherit; font-size: 10px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .12s, background .12s, color .12s;
  }
  .chip:hover .link { opacity: 1; pointer-events: auto; }
  .chip .link:hover { background: rgba(124,140,255,.5); color: #fff; }
  .tick { position: absolute; left: 0; width: 6px; height: 2px; border-radius: 2px; opacity: .7; }

  /* ---------------- 拖拽改期 ---------------- */
  body.drag-lock,
  body.drag-lock * { user-select: none; }        /* 只禁选中，滚轮/边缘滚动照常 */
  .chip.dragging {
    cursor: grabbing;
    transition: none;
    z-index: 30 !important;
    background: rgba(124,140,255,.16);
    border-color: rgba(124,140,255,.4);
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.9);
  }
  .dragtip {
    position: fixed; z-index: 70; pointer-events: none;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(20,21,26,.95);
    border: 1px solid rgba(255,255,255,.14);
    color: #E9E9F0; font-size: 10px; letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .1s;
  }
  .dragtip.on { opacity: 1; }

  /* ---------------- now 线 ---------------- */
  .nowline {
    position: absolute; left: var(--gutter); right: 0; top: 50%;
    height: 1px; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,107,138,.7), rgba(255,107,138,.2) 52%, rgba(255,107,138,.04));
    box-shadow: 0 0 10px rgba(255,107,138,.4);
  }
  .nowbadge {
    position: absolute; left: var(--gutter); right: 0; top: 50%;
    height: 0; z-index: 9; pointer-events: none;
  }
  .nowbadge .glow {
    position: absolute; left: -10px; top: -13px; width: 30px; height: 27px;
    background: radial-gradient(circle, rgba(255,107,138,.4), transparent 70%);
    filter: blur(5px);
  }
  .nowbadge .dot2 {
    position: absolute; left: -3px; top: -3px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #FF7E9B; box-shadow: 0 0 10px rgba(255,107,138,.95);
  }
  .nowtime {
    position: absolute; left: -50px; top: -9px;
    font-size: 9.5px; letter-spacing: .07em;
    color: #FFA6B7;
    background: rgba(255,107,138,.16);
    border: 1px solid rgba(255,107,138,.22);
    padding: 1px 5px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------------- 待安排 ---------------- */
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
    border-top: 1px solid rgba(255,255,255,.07);
    background: rgba(13,14,19,.97);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .drawer-head {
    height: 40px; padding: 0 16px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    font-size: 11.5px; color: var(--dim);
  }
  .drawer-head:hover { background: rgba(255,255,255,.03); }
  .drawer-head b { color: #BDC0CA; font-weight: 500; }
  .drawer-head .count {
    font-size: 9.5px; color: var(--faint);
    background: rgba(255,255,255,.055); padding: 1px 6px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }
  .drawer-head .chev {
    margin-left: auto; width: 12px; height: 12px;
    stroke: var(--faint); fill: none; stroke-width: 1.8;
    transition: transform .2s;
  }
  .drawer.open .chev { transform: rotate(180deg); }
  .drawer-body {
    max-height: 0; overflow: hidden;
    transition: max-height .26s cubic-bezier(.2,.8,.3,1);
  }
  .drawer.open .drawer-body { max-height: 168px; overflow-y: auto; }
  .ditem {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    font-size: 12px; color: #D2D2DB;
    cursor: default;
  }
  .ditem:hover { background: rgba(255,255,255,.045); }
  .ditem .dot { margin-top: 0; }
  .ditem .tag {
    margin-left: auto; font-size: 9px; color: var(--faint);
    background: rgba(255,255,255,.045); padding: 1px 5px; border-radius: 4px;
  }

  /* ---------------- 设置浮层 ---------------- */
  .settings {
    position: absolute; z-index: 40;
    right: 12px; top: 52px;
    width: 252px;
    padding: 13px 13px 11px;
    border-radius: 14px;
    background: rgba(26,27,33,.95);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(24px);
    box-shadow: 0 26px 64px -18px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.06);
    opacity: 0; transform: translateY(-6px) scale(.98);
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .settings.open { opacity: 1; transform: none; pointer-events: auto; }
  .settings h4 {
    font-size: 10px; font-weight: 500; letter-spacing: .16em;
    color: var(--faint); text-transform: uppercase;
    margin-bottom: 9px;
  }
  .srow {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 34px; gap: 10px;

    { title: "研究 Obsidian 插件",  status: "doing", tag: "学习" }
  ];
  const tasks = (window.__DATA__ && window.__DATA__.tasks) || MOCK_TASKS;

  /* 按真实数据扩展时间范围：往前至少 2 天，往后覆盖最远截止日 + 1 天 */
  function computeRange() {
    const hours = [];
    tasks.forEach(t => {
      if (typeof t.sched === "number") hours.push(t.sched);
      if (typeof t.due === "number") hours.push(t.due);
    });
    START_DAY = -2;
    DAYS = 8;
    canvasStart = base + START_DAY * DAY;
    if (!hours.length) return;
    START_DAY = Math.min(-2, Math.floor(Math.min(...hours) / 24) - 1);
    const endDay = Math.max(5, Math.ceil(Math.max(...hours) / 24) + 1);
    DAYS = endDay - START_DAY + 1;
    canvasStart = base + START_DAY * DAY;
  }
  computeRange();

  const pad = n => String(n).padStart(2, "0");
  const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const yOf = ts => ((ts - canvasStart) / 60000) * PX_PER_MIN;

  const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  document.getElementById("dateText").textContent = (NOW.getMonth() + 1) + "月" + NOW.getDate() + "日";
  document.getElementById("weekText").textContent = WEEK[NOW.getDay()];
  document.getElementById("nowtime").textContent = hhmm(nowTs);

  const canvas = document.getElementById("canvas");
  const scroll = document.getElementById("scroll");
  canvas.style.height = (DAYS * 24 * PX_PER_HOUR) + "px";

  const dayMarks = [];   // 缩放时按 index 重算 top

  function rebuildDayMarks() {
    canvas.querySelectorAll(".dayline, .daylabel").forEach(node => node.remove());
    dayMarks.length = 0;
    for (let i = 0; i < DAYS; i++) {
    const ts = canvasStart + i * DAY;
    const d = new Date(ts);
    const y = i * 24 * PX_PER_HOUR;

    const line = document.createElement("div");
    line.className = "dayline";
    line.style.top = y + "px";
    canvas.appendChild(line);

    const isToday = d.toDateString() === NOW.toDateString();
    const label = document.createElement("div");
    label.className = "daylabel" + (isToday ? " today" : "");
    label.style.top = y + "px";
    label.innerHTML =
      '<span class="row"><span class="num">' + d.getDate() + '</span>' +
      '<span class="wd">' + WEEK[d.getDay()].replace("周", "") + '</span></span>' +
      (isToday ? '<span class="today-pill">今天</span>' : "");
    canvas.appendChild(label);
    dayMarks.push({ index: i, line, label });
    }
  }
  rebuildDayMarks();

  const lanes = {
    sched: Object.assign(document.createElement("div"), { className: "lane" }),
    due:   Object.assign(document.createElement("div"), { className: "lane" })
  };
  lanes.sched.dataset.track = "sched";
  lanes.due.dataset.track = "due";
  lanes.sched.style.setProperty("--lane-color", "var(--sched)");
  lanes.due.style.setProperty("--lane-color", "var(--due)");
  canvas.appendChild(lanes.sched);
  canvas.appendChild(lanes.due);

  const items = { sched: [], due: [] };

  function chipHtml(t, ts, late, allDay) {
    const lateText = late
      ? (nowTs - ts >= DAY ? "逾期 " + Math.ceil((nowTs - ts) / DAY) + "d"
                           : "逾期 " + Math.max(1, Math.round((nowTs - ts) / H)) + "h")
      : "";
    return (
      '<div class="row1">' +
        '<span class="dot ' + t.status + '"></span>' +
        '<span class="t">' + t.title + '</span>' +
      '</div>' +
      '<button class="link" title="在 Notion 打开" aria-label="在 Notion 打开">↗</button>' +
      '<div class="row2">' +
        '<span>' + (allDay ? "全天" : hhmm(ts)) + '</span>' +
        (t.tag ? '<span class="tag">' + t.tag + '</span>' : '') +
        (lateText ? '<span class="late">' + lateText + '</span>' : '') +
      '</div>'
    );
  }

  /* ---------- 拖拽改期（同轨上下拖，15 分钟吸附） ---------- */
  const dragtip = document.getElementById("dragtip");
  const TRACK_PROP = { sched: "安排日期", due: "截止日期" };
  const ALL_DAY_KEY = { sched: "allDaySched", due: "allDayDue" };
  const DRAG_SNAP_MIN = 15;   // 吸附粒度
  const DRAG_CLICK_PX = 4;    // 位移小于这个像素数算点击，不写
  let dragActive = false;     // 拖拽中忽略缩放，否则像素位移和分钟数会换算错

  /* 指针位置 → 该处的时刻（含当前滚动量，滚动后依然对得上） */
  function tsAtPoint(clientY) {
    const rect = scroll.getBoundingClientRect();
    return canvasStart + ((scroll.scrollTop + (clientY - rect.top)) / PX_PER_MIN) * 60000;
  }

  /* 目标时刻 → 吸附后的毫秒数：全天按整天，其余按 15 分钟 */
  function snapMs(ms, allDay) {
    const step = allDay ? DAY : DRAG_SNAP_MIN * 60000;
    return Math.round(ms / step) * step;
  }

  /* 时间气泡：目标时刻（跨天时把日期一起给出） */
  function tipLabel(t, key, ts) {
    const d = new Date(ts);
    const day = (d.getMonth() + 1) + "-" + d.getDate();
    return t[ALL_DAY_KEY[key]] ? day + " 全天" : day + " " + hhmm(ts);
  }

  const DRAG_EDGE_PX = 48;      // 进入上下这么多像素开始自动滚
  const DRAG_SPEED_MIN = 2;     // 贴边前的速度 px/帧
  const DRAG_SPEED_MAX = 14;    // 贴边时的速度 px/帧

  function startDrag(e, el, t, key) {
    const item = items[key].find(it => it.el === el);
    if (!item) return;
    const allDay = !!t[ALL_DAY_KEY[key]];
    const startTs = base + t[key] * H;
    const grabTs = tsAtPoint(e.clientY);   // 按下瞬间指针下的时刻
    const origTop = parseFloat(el.style.top) || item.y;
    const topOffset = origTop - yOf(startTs);   // 被避让顶开的那点偏移，拖动时保留
    const startClientY = e.clientY;
    let pointerY = e.clientY;
    let dragging = false;
    let targetTs = startTs;
    let raf = 0;

    e.preventDefault();    // 禁掉原生文本选择 / 拖影
    e.stopPropagation();   // 别冒泡出去，避免触发窗口拖动
    dragActive = true;
    document.body.classList.add("drag-lock");

    const restore = () => {
      el.style.top = origTop + "px";
      layoutLane(key);
    };

    /* 每帧都按「指针 y + scrollTop」重新算目标时刻，所以滚动不会累积误差 */
    const updatePreview = () => {
      targetTs = startTs + (tsAtPoint(pointerY) - grabTs);
      el.style.top = (yOf(targetTs) + topOffset) + "px";
      dragtip.textContent = tipLabel(t, key, startTs + snapMs(targetTs - startTs, allDay));
      dragtip.classList.add("on");
    };

    const placeTip = ev => {
      dragtip.style.left = Math.min(ev.clientX + 12, window.innerWidth - 120) + "px";
      dragtip.style.top = Math.max(4, ev.clientY - 28) + "px";
    };

    const autoStep = () => {
      raf = 0;
      if (!dragging) return;
      const rect = scroll.getBoundingClientRect();
      let speed = 0;
      if (pointerY < rect.top + DRAG_EDGE_PX) {
        const k = Math.min(1, (rect.top + DRAG_EDGE_PX - pointerY) / DRAG_EDGE_PX);
        speed = -(DRAG_SPEED_MIN + (DRAG_SPEED_MAX - DRAG_SPEED_MIN) * k);
      } else if (pointerY > rect.bottom - DRAG_EDGE_PX) {
        const k = Math.min(1, (pointerY - (rect.bottom - DRAG_EDGE_PX)) / DRAG_EDGE_PX);
        speed = DRAG_SPEED_MIN + (DRAG_SPEED_MAX - DRAG_SPEED_MIN) * k;
      }
      if (speed) {
        const before = scroll.scrollTop;
        scroll.scrollTop = before + speed;
        if (scroll.scrollTop !== before) updatePreview();
      }
      raf = requestAnimationFrame(autoStep);
    };

    const onScroll = () => { if (dragging) updatePreview(); };

    const detach = () => {
      dragActive = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("blur", onCancel);
      scroll.removeEventListener("scroll", onScroll);
      document.body.classList.remove("drag-lock");
      dragtip.classList.remove("on");
      el.classList.remove("dragging");
    };

    /* 拖到窗口外/切走焦点，收不到 mouseup：取消并归位，别卡在拖拽态 */
    const onCancel = () => {
      detach();
      restore();
    };

    const onMove = ev => {
      pointerY = ev.clientY;
      if (!dragging) {
        if (Math.abs(ev.clientY - startClientY) < DRAG_CLICK_PX) return;
        dragging = true;
        el.classList.add("dragging");
        raf = requestAnimationFrame(autoStep);
      }
      updatePreview();
      placeTip(ev);
    };

    const onUp = async () => {
      detach();
      if (!dragging) return;          // 位移不足 4px：当作点击，交给 click 处理
      el._dragEndedAt = Date.now();

      const minutes = snapMs(targetTs - startTs, allDay) / 60000;
      const api = bridge();
      if (!minutes || !api) {
        restore();
        return;
      }
      el.style.opacity = ".7";
      const res = await api.reschedule(t.id, TRACK_PROP[key], minutes);
      el.style.opacity = "";
      if (res && res.ok && res.task) {
        const hours = res.task[key];
        if (typeof hours === "number") {
          t[key] = hours;
          t[ALL_DAY_KEY[key]] = !!res.task[ALL_DAY_KEY[key]];
          item.y = yOf(base + hours * H);
          const timeSpan = el.querySelector(".row2 span");
          if (timeSpan) {
            timeSpan.textContent = t[ALL_DAY_KEY[key]] ? "全天" : hhmm(base + hours * H);
          }
          const late = key === "due" && base + hours * H < nowTs && t.status !== "done";
          el.classList.toggle("overdue", late);
        }
      } else {
        restore();
        alert("改期失败：" + ((res && res.error) || "未知错误"));
      }
      layoutLane(key);
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("blur", onCancel);
    scroll.addEventListener("scroll", onScroll, { passive: true });
  }

  function mountChip(t, key) {
    if (typeof t[key] !== "number") return null;
    const ts = base + t[key] * H;
    const late = key === "due" && ts < nowTs && t.status !== "done";

    const el = document.createElement("div");
    el.className = "chip" + (late ? " overdue" : "") + (t.status === "done" ? " done" : "");
    el.style.top = yOf(ts) + "px";
    el.dataset.id = t.id;
    el.dataset.status = t.status || "";
    el.innerHTML = chipHtml(t, ts, late, key === "sched" ? t.allDaySched : t.allDayDue);

    const linkBtn = el.querySelector(".link");
    if (linkBtn) {
      linkBtn.addEventListener("mousedown", e => {
        e.preventDefault();     // 别让按钮抢焦点：否则会 scrollIntoView，时间轴会跳
        e.stopPropagation();    // 也别启动拖拽
      });
      linkBtn.addEventListener("click", e => {
        e.stopPropagation();
        e.preventDefault();
        const api = bridge();
        if (api) api.open_task(t.id);
      });
    }
    el.addEventListener("click", e => {
      e.stopPropagation();
      if (Date.now() - (el._dragEndedAt || 0) < 300) return;  // 拖拽刚结束，不当点击
      document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
      el.classList.add("sel");
      openDetail(t, key, el);
    });
    el.addEventListener("dblclick", () => {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.open_task(t.id);
    });
    el.addEventListener("contextmenu", e => {
      e.preventDefault();
      e.stopPropagation();
      openCtx(e.clientX, e.clientY, t, el.dataset.status || "");
    });
    el.addEventListener("mousedown", e => {
      if (e.button !== 0) return;                            // 只认左键
      if (e.target.closest(".dot, button, input")) return;    // 状态点/按钮不参与拖拽
      startDrag(e, el, t, key);
    });

    lanes[key].appendChild(el);
    return { el, y: yOf(ts), h: el.offsetHeight, t, key };
  }

  function layoutLane(key) {
    lanes[key].querySelectorAll(".tick").forEach(node => node.remove());
    // items 保留全部（搜索过滤后还要能恢复），只有可见的参与堆叠
    const list = items[key].filter(it => it.el.isConnected);
    items[key] = list;
    const shown = list.filter(it => !it.el.classList.contains("hide"))
      .sort((a, b) => a.y - b.y);
    let cursor = -Infinity;

    shown.forEach(it => {
      const top = Math.max(it.y, cursor);
      it.el.style.top = top + "px";
      it.el.style.left = "7px";
      it.el.style.right = "auto";
      cursor = top + it.h + 4;

      if (top > it.y + 2) {
        const tick = document.createElement("span");
        tick.className = "tick";
        tick.style.top = it.y + "px";
        tick.style.background = key === "due" ? "var(--due)" : "var(--sched)";
        lanes[key].appendChild(tick);
      }
    });
  }

  tasks.forEach(t => {
    ["sched", "due"].forEach(key => {
      const item = mountChip(t, key);
      if (item) items[key].push(item);
    });
  });
  layoutLane("sched");
  layoutLane("due");

  const drawer = document.getElementById("drawer");
  const drawerBody = document.getElementById("drawerBody");
  function renderDrawer() {
    document.getElementById("undatedCount").textContent = undated.length;
    drawerBody.innerHTML = "";
    undated.forEach(t => {
      const row = document.createElement("div");
      row.className = "ditem";
      row.innerHTML = '<span class="dot ' + t.status + '"></span><span>' + t.title + '</span>' +
                      '<span class="tag">' + t.tag + '</span>';
      drawerBody.appendChild(row);
    });
  }
  renderDrawer();
  document.getElementById("drawerHead").addEventListener("click", () => drawer.classList.toggle("open"));

  let earliestOverdue = null;
  const overduePillEl = document.getElementById("summary");

  function jumpToEarliestOverdue() {
    if (!earliestOverdue) return;
    setTrack("due");
    const target = base + earliestOverdue.due * H;
    scroll.scrollTo({ top: Math.max(0, yOf(target) - scroll.clientHeight / 2), behavior: "smooth" });
    const el = document.querySelector('.chip[data-id="' + earliestOverdue.id + '"]');
    if (!el) return;
    document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
    el.classList.add("sel", "flash");
    setTimeout(() => el.classList.remove("flash"), 1400);
  }

  function renderSummary() {
    const todayStart = base, todayEnd = base + DAY;
    let todayCount = 0, overdueCount = 0;
    earliestOverdue = null;
    tasks.forEach(t => {
      if (t.status === "done") return;
      const stamps = [t.sched, t.due].filter(v => typeof v === "number").map(v => base + v * H);
      if (stamps.some(ts => ts >= todayStart && ts < todayEnd)) todayCount++;
      if (typeof t.due === "number" && base + t.due * H < nowTs) {
        overdueCount++;
        if (!earliestOverdue || t.due < earliestOverdue.due) earliestOverdue = t;
      }
    });
    overduePillEl.innerHTML =
      "今天 <b>" + todayCount + "</b> 项 · 逾期 " +
      '<b class="warn' + (earliestOverdue ? " clickable" : "") + '" id="overduePill"' +
      (earliestOverdue ? ' role="button" tabindex="0" title="跳到最早逾期的一项"' : "") +
      ">" + overdueCount + "</b> 项";
    const pill = document.getElementById("overduePill");
    pill.onclick = e => { e.stopPropagation(); jumpToEarliestOverdue(); };
    pill.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jumpToEarliestOverdue(); }
    };
  }
  renderSummary();

  /* 用当前 tasks/undated 整体重画（刷新数据后调用） */
  function renderTimeline() {
    closeDetail();          // 卡片会被重建，弹窗持有的旧对象要丢掉
    computeRange();
    canvas.style.height = (DAYS * 24 * PX_PER_HOUR) + "px";
    rebuildDayMarks();
    ["sched", "due"].forEach(key => {
      items[key].length = 0;
      lanes[key].innerHTML = "";
    });
    tasks.forEach(t => {
      ["sched", "due"].forEach(key => {
        const item = mountChip(t, key);
        if (item) items[key].push(item);
      });
    });
    layoutLane("sched");
    layoutLane("due");
    updateCounts();
    renderSummary();
    renderDrawer();
    const bar = document.getElementById("searchBar");
    if (bar && bar.classList.contains("open")) applySearch(searchInput.value);
  }

  function scrollToNow(animate) {
    const target = yOf(nowTs) - scroll.clientHeight / 2;
    scroll.scrollTo({ top: Math.max(0, target), behavior: animate ? "smooth" : "auto" });
  }
  requestAnimationFrame(() => scrollToNow(false));
  window.addEventListener("resize", () => scrollToNow(false));
  document.getElementById("btnRefresh").addEventListener("click", async () => {
    const btn = document.getElementById("btnRefresh");
    const api = bridge();
    if (!api || !api.reload_data) { scrollToNow(true); return; }
    btn.classList.add("spinning");
    try {
      const res = await api.reload_data();
      if (res && res.data) {
        tasks.length = 0;
        tasks.push(...(res.data.tasks || []));
        undated.length = 0;
        undated.push(...(res.data.undated || []));
        if (res.data.options) window.__DATA__ = Object.assign({}, window.__DATA__ || {}, res.data);
        renderTimeline();
        scrollToNow(true);
        if (res.error) console.warn("刷新回落：", res.error);
      } else {
        alert("刷新失败：" + ((res && res.error) || "未知错误"));
      }
    } finally {
      btn.classList.remove("spinning");
    }
  });

  /* ---------- 字号缩放 ---------- */
  function updateFontLabel() {
    const label = document.getElementById("fontValue");
    if (label) label.textContent = Math.round(FONT_SCALE * 100) + "%";
  }

  function applyFontScale(value) {
    FONT_SCALE = clampFont(value);
    document.documentElement.style.setProperty("--font-scale", String(FONT_SCALE));
    updateFontLabel();
    // 字变了 → 卡片高度变了，重新量高并重排（不影响 px/hour）
    ["sched", "due"].forEach(key => {
      items[key].forEach(item => { item.h = item.el.offsetHeight; });
      layoutLane(key);
    });
    return FONT_SCALE;
  }

  /* ---------- 时间轴密度（px/hour） ---------- */
  function updateScaleLabel() {
    const label = document.getElementById("scaleValue");
    if (label) {
      const shown = Number.isInteger(PX_PER_HOUR) ? String(PX_PER_HOUR) : PX_PER_HOUR.toFixed(1);
      label.textContent = shown + " px/h";
    }
    const sliderEl = document.getElementById("scaleSlider");
    if (sliderEl) sliderEl.value = String(PX_PER_HOUR);
  }

  /* 换密度并重排。anchorY 是视口坐标：缩放前后该 y 下的时刻不动 */
  function applyScale(next, anchorY) {
    const target = clampScale(next);
    if (dragActive) return PX_PER_HOUR;   // 拖拽中不缩放（见 dragActive 注释）
    if (target === PX_PER_HOUR) return PX_PER_HOUR;

    const rect = scroll.getBoundingClientRect();
    const fromTop = (typeof anchorY === "number")
      ? Math.min(scroll.clientHeight, Math.max(0, anchorY - rect.top))
      : scroll.clientHeight / 2;
    const anchorTs = canvasStart + ((scroll.scrollTop + fromTop) / PX_PER_MIN) * 60000;

    PX_PER_HOUR = target;
    PX_PER_MIN = target / 60;

    canvas.style.height = (DAYS * 24 * PX_PER_HOUR) + "px";
    dayMarks.forEach(mark => {
      const y = mark.index * 24 * PX_PER_HOUR;
      mark.line.style.top = y + "px";
      mark.label.style.top = y + "px";
    });
    ["sched", "due"].forEach(key => {
      items[key].forEach(item => { item.y = yOf(base + item.t[item.key] * H); });
      layoutLane(key);   // 重算避让与 tick
    });
    scroll.scrollTop = Math.max(0, ((anchorTs - canvasStart) / 60000) * PX_PER_MIN - fromTop);
    updateScaleLabel();
    return PX_PER_HOUR;
  }

  /* 隐藏后回默认值；居中到 now */
  function resetScale() {
    applyScale(DEFAULT_SCALE);
    requestAnimationFrame(() => scrollToNow(false));
  }

  updateScaleLabel();

  const settings = document.getElementById("settings");
  document.getElementById("btnSettings").addEventListener("click", e => {
    e.stopPropagation();
    settings.classList.toggle("open");
  });
  settings.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", () => settings.classList.remove("open"));

  /* ---------- 设置项：落 config.json，失败回滚 UI ---------- */
  const slider = document.getElementById("opacitySlider");
  const themeSeg = document.getElementById("themeSeg");
  const swAutostart = document.getElementById("swAutostart");
  const swRelease = document.getElementById("swRelease");
  const hotkeyKeys = document.getElementById("hotkeyKeys");

  function paintSlider(percent) {
    slider.style.background =
      "linear-gradient(90deg, var(--accent) " + percent + "%, rgba(255,255,255,.14) " + percent + "%)";
  }
  paintSlider(slider.value);

  slider.addEventListener("input", () => paintSlider(slider.value));
  slider.addEventListener("change", async () => {
    const value = Number(slider.value);
    const previous = Number(slider.dataset.saved || 82);
    const api = bridge();
    if (!api) return;
    const res = await api.set_config({ opacity: value / 100 });
    if (res && res.ok) {
      slider.dataset.saved = String(value);
    } else {
      slider.value = String(previous);
      paintSlider(previous);
      alert("透明度没保存上：" + ((res && res.error) || "未知错误"));
    }
  });

  const scaleSlider = document.getElementById("scaleSlider");
  let scaleSaveTimer = null;
  scaleSlider.addEventListener("input", () => {
    const value = clampScale(scaleSlider.value);
    DEFAULT_SCALE = value;      // 滑块 = 新的默认密度
    applyScale(value);          // 即时生效
    clearTimeout(scaleSaveTimer);
    scaleSaveTimer = setTimeout(async () => {
      const api = bridge();
      if (!api) return;
      const res = await api.set_config({ timeline_scale: value });
      if (!res || !res.ok) {
        alert("密度没保存上：" + ((res && res.error) || "未知错误"));
        if (res && res.config) {
          DEFAULT_SCALE = clampScale(res.config.timeline_scale);

  timelineEl.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    e.stopPropagation();
    const next = PX_PER_HOUR * (e.deltaY < 0 ? SCALE_WHEEL_FACTOR : 1 / SCALE_WHEEL_FACTOR);

  /* 子序列即可命中：中文按字符、英文忽略大小写 */
  function fuzzyHit(query, title) {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const text = String(title || "").toLowerCase();
    if (text.includes(q)) return true;
    let i = 0;
    for (const ch of text) {
      if (ch === q[i]) i++;
      if (i === q.length) return true;
    }
    return false;
  }

  function applySearch(query) {
    const q = query.trim();
    ["sched", "due"].forEach(key => {
      items[key].forEach(it => {
        it.el.classList.toggle("hide", !fuzzyHit(q, it.t.title));
      });
      layoutLane(key);
    });
    drawerBody.querySelectorAll(".ditem").forEach(row => {
      row.classList.toggle("hide", !!q && !fuzzyHit(q, row.textContent));
    });
    const visible = document.querySelectorAll(
      '.lane[data-track="' + timelineEl.dataset.track + '"] .chip:not(.hide)').length;
    searchCount.textContent = q ? visible + " 条" : "";
    updateCounts();
  }

  function openSearch() {

  function laneItems() {
    const key = timelineEl.dataset.track;
    return items[key]
      .filter(it => it.el.isConnected && !it.el.classList.contains("hide"))
      .sort((a, b) => a.y - b.y);

  function selectChipAt(index) {
    const list = laneItems();
    if (!list.length) return null;
    selIndex = Math.max(0, Math.min(list.length - 1, index));
    document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
    const item = list[selIndex];
    item.el.classList.add("sel");
    const rect = item.el.getBoundingClientRect();
    const box = scroll.getBoundingClientRect();
    if (rect.top < box.top + 44 || rect.bottom > box.bottom - 44) {
      scroll.scrollTop += rect.top - (box.top + box.height / 2);
    }
    return item;
  }

  function selectedItem() {
    return laneItems()[selIndex] || null;

    const item = selectedItem();
    if (!item || !item.el.isConnected) return;
    const t = item.t;
    if (!confirm("删除「" + t.title + "」？会移入 Notion 回收站。")) return;

      selIndex = -1;

    const tag = e.target && e.target.tagName;

    if (e.key === "ArrowRight") { setTrack("due"); selIndex = -1; return; }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      selectChipAt(selIndex < 0 ? 0 : selIndex + 1);

    if (e.key === "ArrowUp") {
      e.preventDefault();
      selectChipAt(selIndex < 0 ? 0 : selIndex - 1);
      return;

    if (e.key === "Enter") {
      if (detail.classList.contains("open")) return;
      e.preventDefault();
      openSelected();
      return;

  function dateRow(name) {

  function setRow(name, hours, allDay) {
    const row = dateRow(name);
    const dateEl = row.querySelector(".ddate");
    const timeEl = row.querySelector(".dtime");
    const box = row.querySelector(".dallbox");
    if (typeof hours !== "number") {
      dateEl.value = ""; timeEl.value = ""; box.checked = false; timeEl.disabled = false;
      return;

    const d = new Date(base + hours * H);
    dateEl.value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    box.checked = !!allDay;
    timeEl.value = allDay ? "" : pad(d.getHours()) + ":" + pad(d.getMinutes());
    timeEl.disabled = !!allDay;

  function rowValue(name) {
    const row = dateRow(name);
    const start = row.querySelector(".ddate").value;
    if (!start) return null;
    const allDay = row.querySelector(".dallbox").checked;
    const time = allDay ? "" : row.querySelector(".dtime").value;
    return { start: start, start_time: time || null };

  /* 下拉选项：优先用后端给的，缺失时从现有任务里现凑 */
  function taskOptions(name) {
    const given = (window.__DATA__ && window.__DATA__.options && window.__DATA__.options[name]) || [];
    const set = new Set(given);
    tasks.forEach(t => {
      const v = name === "大方向" ? t.dir : t.subject;
      if (v) set.add(v);
    });
    return [...set].sort();
  }

  function fillSelect(sel, options, value) {
    const list = (options || []).slice();
    if (value && list.indexOf(value) < 0) list.push(value);

      list.map(o => '<option value="' + o + '">' + o + "</option>").join("");

      title: dTitle.value.trim(),
      status: currentStatus(),
      dates: { "安排日期": rowValue("安排日期"), "截止日期": rowValue("截止日期") },
      dir: dDir.value,
      subject: dSubject.value
    };

  function placeDetail(el) {
    detail.classList.add("open");            // 先显示才能量尺寸
    const r = el.getBoundingClientRect();
    const w = detail.offsetWidth;
    const h = detail.offsetHeight;
    let left = r.right + 10;
    let top = r.top;
    if (left + w > window.innerWidth - 8) {
      const flipped = r.left - w - 10;
      if (flipped >= 8) {
        left = flipped;                       // 右边放不下 → 翻到左边
      } else {
        left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
        top = r.bottom + 8;                   // 两边都挤 → 放到卡片下面
      }
    }
    top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
    detail.style.left = left + "px";
    detail.style.top = top + "px";
  }

  function openDetail(t, key, el) {
    if (!t) return;
    detailTask = t;
    dTitle.value = t.title || "";

      b.classList.toggle("on", b.dataset.status === (t.status || "todo")));
    setRow("安排日期", t.sched, t.allDaySched);
    setRow("截止日期", t.due, t.allDayDue);
    fillSelect(dDir, taskOptions("大方向"), t.dir);
    fillSelect(dSubject, taskOptions("学科"), t.subject);
    detailBusy = false;
    detailSaved = readDetail();
    placeDetail(el);

    if (!detailSaved) return;
    dTitle.value = detailSaved.title;
    dStatus.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", b.dataset.status === detailSaved.status));
    DATE_ROWS.forEach(name => {
      const v = detailSaved.dates[name];
      const row = dateRow(name);
      const allDay = !!(v && !v.start_time);
      row.querySelector(".ddate").value = v ? v.start : "";
      row.querySelector(".dtime").value = v && v.start_time ? v.start_time : "";

  /* 更新该任务的所有卡片（两条轨道都可能挂），必要时补挂或移除 */
  function refreshChips(t) {
    ["sched", "due"].forEach(key => {
      const hasValue = typeof t[key] === "number";
      if (!hasValue) {
        items[key].forEach(item => { if (item.t.id === t.id) item.el.remove(); });
        items[key] = items[key].filter(item => item.t.id !== t.id);
      } else {
        let item = items[key].find(it => it.t.id === t.id);
        if (!item) {
          item = mountChip(t, key);
          if (item) items[key].push(item);
        }
        if (item) {
          const el = item.el;
          el.querySelector(".t").textContent = t.title;
          el.dataset.status = t.status || "";
          const dot = el.querySelector(".dot");
          if (dot) dot.className = "dot " + (t.status || "");
          el.classList.toggle("done", t.status === "done");
          item.y = yOf(base + t[key] * H);
          const timeSpan = el.querySelector(".row2 span");
          if (timeSpan) timeSpan.textContent = t[ALL_DAY_KEY[key]] ? "全天" : hhmm(base + t[key] * H);
          const late = key === "due" && base + t[key] * H < nowTs && t.status !== "done";
          el.classList.toggle("overdue", late);
        }
      }
      layoutLane(key);
    });
  }

  function applyDetailResult(uiTask) {
    const t = detailTask;
    if (!t) return;
    ["title", "status", "tag", "dir", "subject", "sched", "due", "allDaySched", "allDayDue"]
      .forEach(k => {
        if (k in uiTask) t[k] = uiTask[k];
        else delete t[k];
      });
    refreshChips(t);
  }

  async function saveDetail() {
    if (!detailTask || !detailSaved || detailBusy) return;
    const next = readDetail();
    const patch = {};
    if (next.title && next.title !== detailSaved.title) patch.title = next.title;
    if (next.status !== detailSaved.status) patch.status = STATUS_NAME[next.status];
    const dates = {};
    DATE_ROWS.forEach(name => {
      const v = next.dates[name];
      if (v && JSON.stringify(v) !== JSON.stringify(detailSaved.dates[name])) dates[name] = v;
    });
    if (Object.keys(dates).length) patch.dates = dates;
    const props = {};
    if (next.dir !== detailSaved.dir) props["大方向"] = { type: "select", value: next.dir || null };
    if (next.subject !== detailSaved.subject) props["学科"] = { type: "select", value: next.subject || null };
    if (Object.keys(props).length) patch.properties = props;
    if (!Object.keys(patch).length) return;

    const api = bridge();
    if (!api) return;
    detailBusy = true;
    const res = await api.update_task_fields(detailTask.id, patch);
    detailBusy = false;
    if (res && res.ok && res.task) {
      detailSaved = next;
      applyDetailResult(res.task);
    } else {
      revertDetail();
      alert("保存失败：" + ((res && res.error) || "未知错误"));

  /* ---------- 快速新增 ---------- */
  const input = document.getElementById("quickInput");

  /* 当前轨道对应的日期属性 */
  function currentTrackProp() {

  }

  /* 该时刻 → 快速新增的预填文案（15 分钟取整 + 相对日） */
  function quickAddText(ts) {
    const d = new Date(ts);
    d.setMinutes(Math.round(d.getMinutes() / 15) * 15, 0, 0);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const diff = Math.round((dayStart - base) / DAY);
    const word = diff === 0 ? "今天" : diff === 1 ? "明天" : diff === 2 ? "后天"
      : diff === -1 ? "昨天"
      : (d.getMonth() + 1) + "月" + d.getDate() + "日";
    return word + " " + hhmm(d.getTime()) + " ";
  }

  /* 双击时间轴空白：把该位置的时间填进快速新增并聚焦 */
  scroll.addEventListener("dblclick", e => {
    if (e.target.closest(".chip, .dot, button, input")) return;   // 卡片/控件不接管
    input.value = quickAddText(snapMs(tsAtPoint(e.clientY), false));
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  });

  input.addEventListener("keydown", async e => {
    if (e.key !== "Enter" || !input.value.trim()) return;
    const text = input.value.trim();

    if (!(window.pywebview && window.pywebview.api)) {
      input.value = "";
      input.placeholder = "浏览器预览不会写入";
      setTimeout(() => { input.placeholder = "明天 15:00 交作业"; }, 1800);
      return;
    }

    input.value = "";
    input.placeholder = "正在写入…";
    const res = await window.pywebview.api.create_from_text(text, currentTrackProp());
    if (res && res.ok && res.task) {
      window.__hud.add(res.task);
      input.placeholder = "已加入：" + res.task.title;
    } else {
      input.value = text;
      input.placeholder = "写入失败：" + ((res && res.error) || "未知错误");
    }
    setTimeout(() => { input.placeholder = "明天 15:00 交作业"; }, 2400);
  });
})();
</script>
</body>
</html>
