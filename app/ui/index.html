  /* 就地编辑：Enter 保存 / Shift+Enter 换行 / Esc 取消 / 失焦保存 */
  function startEdit(el, block, txt) {
    if (el.classList.contains("saving") || txt.isContentEditable) return;
    const before = block.text || "";
    txt.contentEditable = "true";
    txt.classList.add("editing");
    txt.focus();
    const range = document.createRange();
    range.selectNodeContents(txt);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let done = false;
    const finish = async save => {
      if (done) return;
      done = true;
      txt.removeEventListener("keydown", onKey);
      txt.removeEventListener("blur", onBlur);
      txt.contentEditable = "false";
      txt.classList.remove("editing");
      const value = txt.innerText.replace(/\n$/, "");
      if (!save || value === before) { txt.textContent = before; return; }
      el.classList.add("saving");
      const api = bridge();
      const res = api ? await api.update_block_text(block.id, value) : { ok: false, error: "预览模式" };
      el.classList.remove("saving");
      if (res && res.ok) {
        block.text = value;
        txt.textContent = value;
      } else {
        txt.textContent = before;
        toast("保存失败：" + ((res && res.error) || "未知错误"));
      }
    };
    const onKey = ev => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault(); ev.stopPropagation(); finish(true);
      } else if (ev.key === "Escape") {
        ev.preventDefault(); ev.stopPropagation(); finish(false);
      } else {
        ev.stopPropagation();     // 别让全局快捷键（Delete/↑↓/Enter）插手编辑
      }
    };
    const onBlur = () => finish(true);
    txt.addEventListener("keydown", onKey);
    txt.addEventListener("blur", onBlur);
  }

  async function toggleTodo(el, block) {
    if (el.classList.contains("saving")) return;
    const next = !block.checked;
    el.classList.add("saving");
    const api = bridge();
    const res = api ? await api.set_todo_checked(block.id, next) : { ok: false, error: "预览模式" };
    el.classList.remove("saving");
    if (res && res.ok) {
      block.checked = next;
      el.classList.toggle("done", next);
      const box = el.querySelector(".bcheck");
      if (box) box.textContent = next ? "☑" : "☐";
    } else {
      toast("勾选失败：" + ((res && res.error) || "未知错误"));
    }
  }

  async function removeBlock(el, block) {
    if (!await askConfirm({
      title: "删除这一块？",
      text: "会移入 Notion 回收站，30 天内可恢复。",
      okText: "删除", danger: true,
    })) return;
    el.classList.add("saving");
    const api = bridge();
    const res = api ? await api.delete_block(block.id) : { ok: false, error: "预览模式" };
    if (res && res.ok) {
      const idx = currentBlocks.indexOf(block);
      if (idx >= 0) currentBlocks.splice(idx, 1);
      el.remove();
      if (!dContent.querySelector(".blk")) renderContent({ blocks: [] });
    } else {
      el.classList.remove("saving");
      toast("删除失败：" + ((res && res.error) || "未知错误"));
    }
  }

  async function addParagraph() {
    if (!detailTask) return;
    const api = bridge();
    if (!api) return;
    const btn = dContent.querySelector(".dadd");
    if (btn) btn.disabled = true;
    const res = await api.append_paragraph(detailTask.id, "");
    if (btn) btn.disabled = false;
    if (!res || !res.ok) {
      toast("添加失败：" + ((res && res.error) || "未知错误"));
      return;
    }
    const block = { id: res.block_id, type: "paragraph", text: "", checked: false, lang: "", level: 1 };
    currentBlocks.push(block);
    const el = renderBlock(block, 1);
    const addBtn = dContent.querySelector(".dadd");
    dContent.insertBefore(el, addBtn || null);
    startEdit(el, block, block._txt);
  }

  function renderContent(res) {
    contentSeq += 1;                      // 渲染完成，作废挂起的骨架
    const blocks = (res && res.blocks) || [];
    currentBlocks = blocks;
    dContent.innerHTML = "";
    if (!blocks.length) {
      const empty = document.createElement("div");
      empty.className = "dempty";
      empty.textContent = "这一页还没有内容";
      dContent.appendChild(empty);
    } else {
      let num = 0;
      blocks.forEach(b => {
        if (b.type === "numbered_list_item") num += 1; else num = 0;
        dContent.appendChild(renderBlock(b, num || 1));
      });
      if (res.truncated) {
        const tip = document.createElement("div");
        tip.className = "dnote";
        tip.textContent = "内容较多，只显示前一部分";
        dContent.appendChild(tip);
      }
    }
    const add = document.createElement("button");
    add.className = "dadd";
    add.textContent = "＋ 添加一段";
    add.addEventListener("click", e => { e.stopPropagation(); addParagraph(); });
    dContent.appendChild(add);

    const note = document.createElement("div");
    note.className = "dnote";
    note.textContent = "改动即时写回 Notion · 行内格式会合并成纯文本";
    dContent.appendChild(note);
  }

  /* 保留旧内容时的内联错误条：一行提示 + 重试 */
  function showInlineError(message) {
    let bar = dContent.querySelector(".derror.inline");
    if (!bar) {
      bar = document.createElement("div");
      bar.className = "derror inline";
      dContent.insertBefore(bar, dContent.firstChild);
    }
    bar.textContent = (message || "刷新失败") + " ";
    const retry = document.createElement("button");
    retry.textContent = "重试";
    retry.addEventListener("click", e => {
      e.stopPropagation();
      bar.remove();
      loadContent(detailTask, { refresh: true });
    });
    bar.appendChild(retry);
  }

  function renderContentError(message) {
    contentSeq += 1;
    dContent.innerHTML = "";
    const box = document.createElement("div");
    box.className = "derror";
    box.textContent = message || "加载失败";
    const retry = document.createElement("button");
    retry.textContent = "重试";
    retry.addEventListener("click", e => { e.stopPropagation(); loadContent(detailTask); });
    box.appendChild(document.createElement("br"));
    box.appendChild(retry);
    dContent.appendChild(box);
  }

  async function loadContent(t, opts = {}) {
    if (!t) return;
    const seq = ++contentSeq;
    const snapshot = dContent.innerHTML;              // 失败时恢复用
    const hadContent = !!dContent.querySelector(".blk, .dempty");
    dContent.innerHTML = '<div class="skel"></div>'.repeat(4);
    const api = bridge();
    if (!api || !api.get_page_content) {
      if (seq === contentSeq) renderContentError("浏览器预览无法读取内容");
      return;
    }
    let res = null;
    try {
      res = await api.get_page_content(t.id, opts.refresh === true);
    } catch (err) {
      res = { ok: false, error: String(err) };
    }
    if (seq !== contentSeq) return;        // 期间换了任务或已重载
    if (!res || !res.ok) {
      const message = (res && res.error) || "未知错误";
      if (hadContent) {
        dContent.innerHTML = snapshot;               // 失败保留旧内容
        showInlineError(message);                    // 内联错误条 + 重试
      } else {
        renderContentError(message);
      }
      return;
    }
    renderContent(res);
  }

  dTabs.addEventListener("click", e => {
    if (e.target.closest("#dRefresh")) {
      e.stopPropagation();
      if (detailTask) loadContent(detailTask, { refresh: true });
      return;
    }
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    e.stopPropagation();
    setDetailTab(btn.dataset.tab);
  });

  function placeDetail(el) {
    detail.classList.add("open");            // 先显示才能量尺寸
    const r = el.getBoundingClientRect();
    const w = detail.offsetWidth;
    const h = detail.offsetHeight;
    let left = r.right + 10;
    let top = r.top;
    if (left + w > window.innerWidth - 8) {
      const flipped = r.left - w - 10;
      if (flipped >= 8) {
        left = flipped;                       // 右边放不下 → 翻到左边
      } else {
        left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
        top = r.bottom + 8;                   // 两边都挤 → 放到卡片下面
      }
    }
    // 左侧 54px 是日期刻度列，弹窗别盖住它
    if (left < 54) left = Math.min(54, window.innerWidth - w - 8);
    top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
    detail.style.left = left + "px";
    detail.style.top = top + "px";
  }

  function openDetail(t, key, el) {
    if (!t) return;
    markIntroSeen();
    detailTask = t;
    dTitle.value = t.title || "";
    dStatus.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", b.dataset.status === (t.status || "todo")));
    setRow("安排日期", t.sched, t.allDaySched);
    setRow("截止日期", t.due, t.allDayDue);
    fillSelect(dDir, taskOptions("大方向"), t.dir);
    fillSelect(dSubject, taskOptions("学科"), t.subject);
    detailBusy = false;
    detailSaved = readDetail();
    setDetailTab("content");     // 每次打开都从内容页开始
    loadContent(t);
    placeDetail(el);
  }

  function closeDetail() {
    detail.classList.remove("open");
    clearTimeout(detailTimer);
    detailTimer = null;
    detailTask = null;
    detailSaved = null;
  }

  function revertDetail() {
    if (!detailSaved) return;
    dTitle.value = detailSaved.title;
    dStatus.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", b.dataset.status === detailSaved.status));
    DATE_ROWS.forEach(name => {
      const v = detailSaved.dates[name];
      const row = dateRow(name);
      const allDay = !!(v && !v.start_time);
      row.querySelector(".ddate").value = v ? v.start : "";
      row.querySelector(".dtime").value = v && v.start_time ? v.start_time : "";
      row.querySelector(".dallbox").checked = allDay;
      row.querySelector(".dtime").disabled = allDay;
    });
    dDir.value = detailSaved.dir || "";
    dSubject.value = detailSaved.subject || "";
  }

  /* 更新该任务的所有卡片（两条轨道都可能挂），必要时补挂或移除 */
  function refreshChips(t) {
    ["sched", "due"].forEach(key => {
      const hasValue = typeof t[key] === "number";
      if (!hasValue) {
        items[key].forEach(item => { if (item.t.id === t.id) item.el.remove(); });
        items[key] = items[key].filter(item => item.t.id !== t.id);
      } else {
        let item = items[key].find(it => it.t.id === t.id);
        if (!item) {
          item = mountChip(t, key);
          if (item) items[key].push(item);
        }
        if (item) {
          const el = item.el;
          el.querySelector(".t").textContent = t.title;
          el.dataset.status = t.status || "";
          const dot = el.querySelector(".dot");
          if (dot) dot.className = "dot " + (t.status || "");
          el.classList.toggle("done", t.status === "done");
          item.y = yOf(base + t[key] * H);
          const timeSpan = el.querySelector(".row2 span");
          if (timeSpan) timeSpan.textContent = chipTimeText(t, key);
          applyChipSpanHeight(item);
          const late = key === "due" && base + t[key] * H < nowTs && t.status !== "done";
          el.classList.toggle("overdue", late);
        }
      }
      layoutLane(key);
    });
  }

  function applyDetailResult(uiTask) {
    const t = detailTask;
    if (!t) return;
    ["title", "status", "tag", "dir", "subject", "sched", "due", "allDaySched", "allDayDue"]
      .forEach(k => {
        if (k in uiTask) t[k] = uiTask[k];
        else delete t[k];
      });
    refreshChips(t);
  }

  async function saveDetail() {
    if (!detailTask || !detailSaved || detailBusy) return;
    const next = readDetail();
    const patch = {};
    if (next.title && next.title !== detailSaved.title) patch.title = next.title;
    if (next.status !== detailSaved.status) patch.status = STATUS_NAME[next.status];
    const dates = {};
    DATE_ROWS.forEach(name => {
      const v = next.dates[name];
      if (v && JSON.stringify(v) !== JSON.stringify(detailSaved.dates[name])) dates[name] = v;
    });
    if (Object.keys(dates).length) patch.dates = dates;
    const props = {};
    if (next.dir !== detailSaved.dir) props["大方向"] = { type: "select", value: next.dir || null };
    if (next.subject !== detailSaved.subject) props["学科"] = { type: "select", value: next.subject || null };
    if (Object.keys(props).length) patch.properties = props;
    if (!Object.keys(patch).length) return;

    const api = bridge();
    if (!api) return;
    detailBusy = true;
    const res = await api.update_task_fields(detailTask.id, patch);
    detailBusy = false;
    if (res && res.ok && res.task) {
      detailSaved = next;
      applyDetailResult(res.task);
    } else {
      revertDetail();
      toast("保存失败：" + ((res && res.error) || "未知错误"));
    }
  }

  function scheduleSave() {
    clearTimeout(detailTimer);
    detailTimer = setTimeout(saveDetail, 500);
  }

  dTitle.addEventListener("input", scheduleSave);
  dDir.addEventListener("change", scheduleSave);
  dSubject.addEventListener("change", scheduleSave);
  dStatus.addEventListener("click", e => {
    const btn = e.target.closest("button[data-status]");
    if (!btn) return;
    dStatus.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    scheduleSave();
  });
  DATE_ROWS.forEach(name => {
    const row = dateRow(name);
    row.querySelector(".ddate").addEventListener("change", scheduleSave);
    row.querySelector(".dtime").addEventListener("change", scheduleSave);
    row.querySelector(".dallbox").addEventListener("change", () => {
      const box = row.querySelector(".dallbox");
      const timeEl = row.querySelector(".dtime");
      timeEl.disabled = box.checked;
      if (box.checked) timeEl.value = "";
      scheduleSave();
    });
  });
  document.getElementById("dOpen").addEventListener("click", () => {
    if (!detailTask) return;
    const api = bridge();
    if (api) api.open_task(detailTask.id);
  });
  /* ---------- 数据源状态（在线 / 离线缓存 / 失败） ---------- */
  function applySyncStatus(info) {
    const el = document.getElementById("syncState");
    const foot = document.getElementById("drawerHead");
    if (!el || !foot) return;
    const source = (info && info.source) || "api";
    el.classList.remove("offline", "error");
    foot.classList.remove("show-retry");
    if (source === "cache") {
      el.textContent = "离线 · 缓存";
      el.classList.add("offline");
    } else if (source === "none") {
      el.textContent = "无法读取数据";
      el.classList.add("error");
      foot.classList.add("show-retry");
    } else {
      el.textContent = "已同步";
    }
    el.title = info && info.error ? String(info.error).slice(0, 200) : "";
  }

  document.getElementById("btnRetry").addEventListener("click", async e => {
    e.stopPropagation();
    const api = bridge();
    if (!api) return;
    const el = document.getElementById("syncState");
    if (el) el.textContent = "正在重试…";
    const res = await api.reload_data();
    if (res && res.data) {
      window.__hud.setData(res.data);
      applySyncStatus({ source: res.source || (res.error ? "cache" : "api"), error: res.error });
    } else {
      applySyncStatus({ source: "none", error: (res && res.error) || "未知错误" });
    }
  });

  document.getElementById("dClose").addEventListener("click", closeDetail);
  document.addEventListener("click", e => {
    if (!detail.classList.contains("open")) return;
    if (e.target.closest("#detail")) return;
    closeDetail();
  });

  window.__hud = {
    add(task) {
      ["sched", "due"].forEach(key => {
        const item = mountChip(task, key);
        if (item) items[key].push(item);
      });
      layoutLane("sched");
      layoutLane("due");
      updateCounts();
    },
    remove(id) {
      if (detailTask && detailTask.id === id) closeDetail();
      document.querySelectorAll('.chip[data-id="' + id + '"]').forEach(el => el.remove());
      layoutLane("sched");
      layoutLane("due");
      updateCounts();
    },
    setStatus(id, status) {
      document.querySelectorAll('.chip[data-id="' + id + '"]').forEach(el => {
        el.dataset.status = status;
        const dot = el.querySelector(".dot");
        if (dot) dot.className = "dot " + status;
        el.classList.toggle("done", status === "done");
      });
    },
    setStatus(info) { applySyncStatus(info); return true; },

    /* 后台刷新推过来的整包数据：保持视口中心时刻与当前轨道 */
    setData(data) {
      if (!data || !Array.isArray(data.tasks)) return false;
      const track = document.getElementById("timeline").dataset.track;
      const rect = scroll.getBoundingClientRect();
      const centerTs = tsAtPoint(rect.top + scroll.clientHeight / 2);
      tasks.length = 0;
      tasks.push(...data.tasks);
      undated.length = 0;
      undated.push(...(data.undated || []));
      if (data.options) window.__DATA__ = Object.assign({}, window.__DATA__ || {}, data);
      renderTimeline();
      setTrack(track);
      scroll.scrollTop = Math.max(
        0, ((centerTs - canvasStart) / 60000) * PX_PER_MIN - contentHalfViewport());
      return true;
    },

    /* 托盘「刷新数据」：不等结果，托盘菜单不该被网络拖住 */
    refresh() {
      if (typeof window.__hudRefreshData !== "function") return false;
      window.__hudRefreshData().catch(err => console.warn("刷新失败：", err));
      return true;
    },

    /* 密度/字号调试自测入口 */
    setScale(value) { return applyScale(value); },
    getScale() { return PX_PER_HOUR; },
    markIntroSeen() { markIntroSeen(); return true; },
    edgeSpeed(y) { return edgeSpeed(y); },
    setFontScale(value) { return applyFontScale(value); },
    getFontScale() { return FONT_SCALE; },
    resetScale() { resetScale(); return PX_PER_HOUR; },
    scrollToNow() { scrollToNow(false); return true; },
    clampConfig(patch) { return clampPatch(patch); },
    /* 坐标换算自测入口（zoom 下应互为逆运算） */
    yToMinute(clientY) { return yToMinute(clientY); },
    minuteToY(minute) { return minuteToY(minute); },
  };

  const ctx = document.getElementById("ctxmenu");
  let ctxTask = null;
  let ctxStatus = "";

  function openCtx(x, y, task, status) {
    ctxTask = task;
    ctxStatus = status;
    ctx.classList.add("open");
    const w = 132, h = 112;
    ctx.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
    ctx.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  }

  document.addEventListener("click", () => ctx.classList.remove("open"));

  ctx.addEventListener("click", async e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (!act || !ctxTask) return;
    const task = ctxTask;
    ctx.classList.remove("open");
    if (!(window.pywebview && window.pywebview.api)) return;

    if (act === "open") {
      window.pywebview.api.open_task(task.id);
    } else if (act === "status") {
      const res = await window.pywebview.api.cycle_status(task.id, ctxStatus);
      if (res && res.ok) {
        ctxStatus = res.status;
        window.__hud.setStatus(task.id, res.status);
      }
    } else if (act === "del") {
      const okDelete = await askConfirm({
        title: "删除任务？",
        text: "「" + task.title + "」会移入 Notion 回收站，30 天内可恢复。",
        okText: "删除", danger: true,
      });
      if (!okDelete) return;
      const res = await window.pywebview.api.delete_task(task.id);
      if (res && res.ok) window.__hud.remove(task.id);
      else toast("删除失败：" + ((res && res.error) || "未知错误"));
    }
  });

  /* ---------- 快速新增 ---------- */
  const input = document.getElementById("quickInput");

  /* 当前轨道对应的日期属性 */
  function currentTrackProp() {
    return timelineEl.dataset.track === "sched" ? "安排日期" : "截止日期";
  }

  /* 该时刻 → 快速新增的预填文案（15 分钟取整 + 相对日） */
  function quickAddText(ts) {
    const d = new Date(ts);
    d.setMinutes(Math.round(d.getMinutes() / 15) * 15, 0, 0);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const diff = Math.round((dayStart - base) / DAY);
    const word = diff === 0 ? "今天" : diff === 1 ? "明天" : diff === 2 ? "后天"
      : diff === -1 ? "昨天"
      : (d.getMonth() + 1) + "月" + d.getDate() + "日";
    return word + " " + hhmm(d.getTime()) + " ";
  }

  /* 双击时间轴空白：把该位置的时间填进快速新增并聚焦 */
  scroll.addEventListener("dblclick", e => {
    if (e.target.closest(".chip, .dot, button, input")) return;   // 卡片/控件不接管
    input.value = quickAddText(snapMs(tsAtPoint(e.clientY), false));
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  });

  input.addEventListener("keydown", async e => {
    if (e.key !== "Enter" || !input.value.trim()) return;
    const text = input.value.trim();

    if (!(window.pywebview && window.pywebview.api)) {
      input.value = "";
      input.placeholder = "浏览器预览不会写入";
      setTimeout(() => { input.placeholder = "明天 15:00 交作业"; }, 1800);
      return;
    }

    input.value = "";
    input.placeholder = "正在写入…";
    const res = await window.pywebview.api.create_from_text(text, currentTrackProp());
    if (res && res.ok && res.task) {
      window.__hud.add(res.task);
      input.placeholder = "已加入：" + res.task.title;
    } else {
      input.value = text;
      input.placeholder = "写入失败：" + ((res && res.error) || "未知错误");
    }
    setTimeout(() => { input.placeholder = "明天 15:00 交作业"; }, 2400);
  });
})();
</script>
